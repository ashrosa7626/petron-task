<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cigarette Count Results – Petron Tasks</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;600&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root {
      --p-bg:#0B0F1A; --p-card:#121826; --p-border:#1F2A44; --p-header:#0F1B3D;
      --p-blue:#3B82F6; --p-blue-lt:#60A5FA; --p-green:#22C55E; --p-amber:#F59E0B;
      --p-red:#FF4D4F; --p-orange:#F97316; --p-slate:#64748B;
      --p-text:#E6EDF7; --p-text2:#94A3B8; --p-text3:#64748B; --p-btn-sec:#1F2A44;
      --font:'IBM Plex Sans',sans-serif; --mono:'IBM Plex Mono',monospace;
      --radius:12px; --radius-sm:8px;
    }
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    body{background:var(--p-bg);color:var(--p-text);font-family:var(--font);min-height:100vh;font-size:17px}
    .topbar{background:var(--p-header);border-bottom:1px solid var(--p-border);padding:0 16px;height:56px;
            display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:100}
    .topbar-title{font-size:1.05rem;font-weight:800;font-family:'Syne',sans-serif;flex:1;text-align:center;
                  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .topbar-title .br{color:var(--p-blue-lt)}
    .topbar a,.topbar button.lnk{color:var(--p-text2);text-decoration:none;font-size:0.85rem;background:none;
            border:none;font-family:var(--font);cursor:pointer;white-space:nowrap}
    .topbar a:hover,.topbar button.lnk:hover{color:var(--p-text)}
    .spacer{min-width:64px;text-align:right}

    .wrap{max-width:1000px;margin:0 auto;padding:18px 16px 70px}
    .status{padding:14px 16px;border-radius:var(--radius);background:var(--p-card);
            border:1px solid var(--p-border);color:var(--p-text2);font-size:0.9rem}
    .status.err{border-color:rgba(255,77,79,0.35);background:rgba(255,77,79,0.08);color:var(--p-red)}

    .hd{font-size:1.25rem;font-weight:800;font-family:'Syne',sans-serif;margin:4px 0 3px}
    .sub{font-size:0.87rem;color:var(--p-text3);margin-bottom:16px;line-height:1.5}

    .row{background:var(--p-card);border:1px solid var(--p-border);border-radius:var(--radius);
         padding:14px 16px;margin-bottom:10px;display:flex;align-items:center;gap:14px;cursor:pointer;
         transition:border-color 0.12s}
    .row:hover{border-color:var(--p-blue)}
    .row.draft{cursor:default}
    .row.draft:hover{border-color:var(--p-border)}
    .row-main{flex:1;min-width:0}
    .row-t{font-weight:700;font-size:1rem;margin-bottom:3px}
    .row-m{font-size:0.8rem;color:var(--p-text3);font-family:var(--mono)}
    .row-r{text-align:right;flex-shrink:0}
    .tag{display:inline-block;border-radius:99px;padding:3px 10px;font-size:0.72rem;font-weight:700}
    .tag.sub{background:rgba(34,197,94,0.13);color:var(--p-green);border:1px solid rgba(34,197,94,0.4)}
    .tag.drf{background:rgba(245,158,11,0.12);color:var(--p-amber);border:1px solid rgba(245,158,11,0.4)}
    .row-n{font-family:var(--mono);font-size:0.8rem;color:var(--p-text2);margin-top:5px}

    .cards{display:flex;flex-wrap:wrap;gap:9px;margin-bottom:16px}
    .card{background:var(--p-card);border:1px solid var(--p-border);border-radius:var(--radius);
          padding:11px 15px;min-width:104px}
    .card-l{font-size:0.7rem;color:var(--p-text3);text-transform:uppercase;letter-spacing:0.7px;
            margin-bottom:4px}
    .card-v{font-size:1.3rem;font-weight:800;font-family:'Syne',sans-serif}
    .card-v.g{color:var(--p-green)} .card-v.a{color:var(--p-amber)} .card-v.r{color:var(--p-red)}

    .note{border-radius:var(--radius-sm);padding:12px 14px;font-size:0.85rem;line-height:1.55;margin-bottom:14px}
    .note.info{background:rgba(59,130,246,0.08);border:1px solid rgba(59,130,246,0.3);color:var(--p-blue-lt)}
    .note.warn{background:rgba(245,158,11,0.08);border:1px solid rgba(245,158,11,0.3);color:var(--p-amber)}

    .tblwrap{overflow-x:auto;border:1px solid var(--p-border);border-radius:var(--radius);
             background:var(--p-card)}
    table{border-collapse:collapse;width:100%;font-size:0.87rem}
    th,td{padding:9px 12px;text-align:left;white-space:nowrap}
    th{background:#0E1424;color:var(--p-text3);font-size:0.72rem;text-transform:uppercase;
       letter-spacing:0.6px;font-weight:700;position:sticky;top:0;border-bottom:1px solid var(--p-border)}
    tbody tr{border-bottom:1px solid rgba(31,42,68,0.6)}
    tbody tr:last-child{border-bottom:none}
    tbody tr:hover{background:rgba(59,130,246,0.05)}
    td.n{text-align:right;font-family:var(--mono)}
    td.pos{font-family:var(--mono);color:var(--p-text3);font-size:0.8rem}
    td.plu{font-family:var(--mono);color:var(--p-text3);font-size:0.78rem}
    .z{color:var(--p-text3)}
    .v-pos{color:var(--p-red);font-weight:600}
    .v-neg{color:var(--p-amber);font-weight:600}
    .v-ok{color:var(--p-green)}
    .dash{color:#2C3A57}

    .btn{border:none;border-radius:9px;padding:10px 14px;font-family:var(--font);font-weight:700;
         font-size:0.84rem;cursor:pointer;background:var(--p-btn-sec);color:var(--p-text)}
    .btn:hover{background:#2A3A5F}
    .bar{display:flex;gap:9px;align-items:center;margin-bottom:14px;flex-wrap:wrap}
    .bar .grow{flex:1}
    [hidden]{display:none !important}
  </style>
</head>
<body>

<div class="topbar">
  <a href="start.html">&larr; Count</a>
  <div class="topbar-title"><span class="br" id="brLabel">Safari</span> Count Results</div>
  <div class="spacer"><button class="lnk" id="btnBack" hidden>All counts</button></div>
</div>

<div class="wrap">
  <div id="status" class="status">Loading&hellip;</div>

  <div id="listView" hidden>
    <div class="hd">Submitted counts</div>
    <div class="sub">Every count taken for this branch, newest first.
      A submitted count is frozen and cannot be reopened.</div>
    <div id="listRows"></div>
  </div>

  <div id="detailView" hidden>
    <div class="hd" id="dTitle"></div>
    <div class="sub" id="dSub"></div>
    <div class="cards" id="dCards"></div>
    <div id="dNotes"></div>
    <div class="bar">
      <div class="grow"></div>
      <button class="btn" id="btnCsv">Download CSV</button>
      <button class="btn" id="btnPrint">Print</button>
    </div>
    <div class="tblwrap"><table id="dTable"></table></div>
  </div>
</div>

<script>
const SUPABASE_URL = 'https://vwffiuciogthfzekkkkz.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZ3ZmZpdWNpb2d0aGZ6ZWtra2t6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzU4NzcwMTAsImV4cCI6MjA5MTQ1MzAxMH0.OTEyOMn1fmUNV7pR51KMOLsMTNAfytt62uGS_AkQXyw';
const db = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
const el = id => document.getElementById(id);
const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c =>
  ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const setStatus = (m, e) => { const s = el('status'); s.hidden = false; s.textContent = m;
  s.className = 'status' + (e ? ' err' : ''); };
const ddmmyyyy = iso => { const [y, m, d] = String(iso).split('-'); return `${d}/${m}/${y}`; };
const stamp = t => t ? new Date(t).toLocaleString('en-GB',
  { day: '2-digit', month: 'short', hour: '2-digit', minute: '2-digit' }) : '';

let ctx = { branchId: null, branchName: '', counts: [], products: new Map(), order: new Map() };

async function init() {
  const selected = localStorage.getItem('selectedBranch') || 'Safari';
  el('brLabel').textContent = selected;

  const [brRes, verRes, prodRes] = await Promise.all([
    db.from('branch').select('branch_id,name'),
    db.from('planogram_version').select('version_id,branch_id').eq('status', 'active'),
    db.from('product').select('product_id,short_name,plu,brand')
  ]);
  if (brRes.error) return setStatus('Could not read branch: ' + brRes.error.message, true);

  const branches = brRes.data || [];
  const norm = s => String(s || '').toLowerCase().replace(/[^a-z]/g, '');
  const match = branches.find(b => norm(b.branch_id) === norm(selected) || norm(b.name).includes(norm(selected)))
    || branches[0];
  if (!match) return setStatus('No branches configured.', true);
  ctx.branchId = match.branch_id;
  ctx.branchName = match.name;
  ctx.products = new Map((prodRes.data || []).map(p => [p.product_id, p]));

  // Shelf order, so results read in the same sequence the shelf was counted.
  const version = (verRes.data || []).find(v => v.branch_id === ctx.branchId);
  if (version) {
    const { data } = await db.from('planogram_facing')
      .select('shelf,position,product_id').eq('version_id', version.version_id);
    for (const f of (data || [])) {
      const prev = ctx.order.get(f.product_id);
      const key = f.shelf + String(f.position).padStart(3, '0');
      if (!prev || key < prev) ctx.order.set(f.product_id, key);
    }
  }

  const { data, error } = await db.from('stock_count')
    .select('count_id,count_date,title,staff_name,status,started_at,submitted_at')
    .eq('branch_id', ctx.branchId).order('count_date', { ascending: false });
  if (error) return setStatus('Could not read stock_count: ' + error.message, true);
  ctx.counts = data || [];

  // How many lines each count actually holds — a draft has none until submit.
  const ids = ctx.counts.map(c => c.count_id);
  const tally = new Map();
  if (ids.length) {
    const { data: ls } = await db.from('stock_count_line').select('count_id').in('count_id', ids);
    for (const r of (ls || [])) tally.set(r.count_id, (tally.get(r.count_id) || 0) + 1);
  }
  ctx.counts.forEach(c => { c.lineCount = tally.get(c.count_id) || 0; });

  renderList();

  // Deep link: history.html?count=4
  const want = Number(new URLSearchParams(location.search).get('count'));
  if (want && ctx.counts.some(c => c.count_id === want)) openCount(want);
}

function renderList() {
  el('status').hidden = true;
  el('detailView').hidden = true;
  el('btnBack').hidden = true;
  el('listView').hidden = false;
  history.replaceState(null, '', location.pathname);

  if (!ctx.counts.length) {
    el('listRows').innerHTML =
      `<div class="status">No counts yet for ${esc(ctx.branchName)}. ` +
      `<a href="start.html" style="color:var(--p-orange)">Start one</a>.</div>`;
    return;
  }

  el('listRows').innerHTML = ctx.counts.map(c => {
    const submitted = c.status === 'submitted';
    return `<div class="row ${submitted ? '' : 'draft'}" data-id="${c.count_id}">
      <div class="row-main">
        <div class="row-t">${esc(c.title)}</div>
        <div class="row-m">${ddmmyyyy(c.count_date)} &middot; ${esc(c.staff_name)}</div>
      </div>
      <div class="row-r">
        <span class="tag ${submitted ? 'sub' : 'drf'}">${submitted ? 'Submitted' : 'Draft'}</span>
        <div class="row-n">${submitted
          ? c.lineCount + ' products &middot; ' + stamp(c.submitted_at)
          : (c.lineCount ? c.lineCount + ' products' : 'on the counting device')}</div>
      </div>
    </div>`;
  }).join('');

  el('listRows').querySelectorAll('.row').forEach(r => {
    r.addEventListener('click', () => {
      const c = ctx.counts.find(x => x.count_id === Number(r.dataset.id));
      if (c && (c.status === 'submitted' || c.lineCount)) openCount(c.count_id);
    });
  });
}

async function openCount(id) {
  const c = ctx.counts.find(x => x.count_id === id);
  if (!c) return;
  el('listView').hidden = true;
  setStatus('Loading count…');
  history.replaceState(null, '', location.pathname + '?count=' + id);

  const [lineRes, recRes] = await Promise.all([
    db.from('stock_count_line').select('product_id,packs,add_in,not_on_shelf').eq('count_id', id),
    // The view carries only submitted counts, and joins the previous day's
    // closing as this day's opening.
    db.from('vw_daily_reconciliation')
      .select('product_id,opening_packs,add_in,closing_packs,sold_physical,sold_pos,variance_packs')
      .eq('branch_id', ctx.branchId).eq('count_date', c.count_date)
  ]);
  if (lineRes.error) return setStatus('Could not read the count lines: ' + lineRes.error.message, true);

  const rec = new Map((recRes.data || []).map(r => [r.product_id, r]));
  const rows = (lineRes.data || []).map(l => {
    const p = ctx.products.get(l.product_id) || {};
    return {
      product_id: l.product_id,
      short_name: p.short_name || l.product_id,
      plu: p.plu || '',
      pos: ctx.order.get(l.product_id) || 'zzz',
      packs: l.not_on_shelf && l.packs === null ? 0 : l.packs,
      not_on_shelf: l.not_on_shelf,
      r: rec.get(l.product_id) || null
    };
  }).sort((a, b) => a.pos.localeCompare(b.pos) || a.short_name.localeCompare(b.short_name));

  renderDetail(c, rows, rec.size > 0);
}

function renderDetail(c, rows, hasRec) {
  el('status').hidden = true;
  el('detailView').hidden = false;
  el('btnBack').hidden = false;

  el('dTitle').textContent = c.title;
  el('dSub').innerHTML = `Trading day <b>${ddmmyyyy(c.count_date)}</b> &middot; ` +
    `${esc(c.staff_name)} &middot; ${esc(ctx.branchName)}` +
    (c.submitted_at ? ` &middot; submitted ${esc(stamp(c.submitted_at))}` : ' &middot; draft');

  const counted = rows.length;
  const totalPacks = rows.reduce((n, r) => n + (r.packs || 0), 0);
  const zeros = rows.filter(r => (r.packs || 0) === 0).length;
  const withVar = rows.filter(r => r.r && r.r.variance_packs !== null && r.r.variance_packs !== undefined);
  const offBy = withVar.filter(r => r.r.variance_packs !== 0).length;

  const cards = [
    ['Products', counted, ''],
    ['Total packs', totalPacks, ''],
    ['Counted zero', zeros, zeros ? 'a' : ''],
  ];
  if (withVar.length) cards.push(['Variances', offBy, offBy ? 'r' : 'g']);
  el('dCards').innerHTML = cards.map(([l, v, k]) =>
    `<div class="card"><div class="card-l">${l}</div><div class="card-v ${k}">${v}</div></div>`).join('');

  const notes = [];
  if (c.status !== 'submitted') {
    notes.push(`<div class="note warn">This count is still a draft. Figures live on the
      counting device until it is submitted, so what is shown here is only what has
      reached the database.</div>`);
  }
  if (hasRec && !withVar.length) {
    notes.push(`<div class="note info">No variance yet. <b>Sold (physical)</b> needs the previous
      day&rsquo;s count to open from, and <b>Sold (POS)</b> needs <code>pos_sales_daily</code>,
      which has no loader yet. The columns fill in once both exist.</div>`);
  }
  el('dNotes').innerHTML = notes.join('');

  const num = v => (v === null || v === undefined) ? '<span class="dash">&mdash;</span>' : v;
  const varCell = v => {
    if (v === null || v === undefined) return '<span class="dash">&mdash;</span>';
    if (v === 0) return '<span class="v-ok">0</span>';
    return `<span class="${v > 0 ? 'v-pos' : 'v-neg'}">${v > 0 ? '+' : ''}${v}</span>`;
  };

  el('dTable').innerHTML =
    `<thead><tr>
      <th>At</th><th>Product</th><th>PLU</th><th style="text-align:right">Packs</th>` +
      (hasRec ? `<th style="text-align:right">Opening</th><th style="text-align:right">Add-in</th>
        <th style="text-align:right">Sold (phys)</th><th style="text-align:right">Sold (POS)</th>
        <th style="text-align:right">Variance</th>` : '') +
    `</tr></thead><tbody>` +
    rows.map(r => `<tr>
      <td class="pos">${esc(String(r.pos).replace(/(\d+)$/, m => String(Number(m))))}</td>
      <td>${esc(r.short_name)}</td>
      <td class="plu">${esc(r.plu)}</td>
      <td class="n ${(r.packs || 0) === 0 ? 'z' : ''}">${r.packs === null ? '&mdash;' : r.packs}</td>` +
      (hasRec ? `<td class="n">${num(r.r && r.r.opening_packs)}</td>
        <td class="n">${num(r.r && r.r.add_in)}</td>
        <td class="n">${num(r.r && r.r.sold_physical)}</td>
        <td class="n">${num(r.r && r.r.sold_pos)}</td>
        <td class="n">${varCell(r.r && r.r.variance_packs)}</td>` : '') +
    `</tr>`).join('') + '</tbody>';

  el('btnCsv').onclick = () => downloadCsv(c, rows, hasRec);
  el('btnPrint').onclick = () => window.print();
}

function downloadCsv(c, rows, hasRec) {
  const head = ['at', 'product_id', 'short_name', 'plu', 'packs'];
  if (hasRec) head.push('opening_packs', 'add_in', 'sold_physical', 'sold_pos', 'variance_packs');
  const q = v => {
    if (v === null || v === undefined) return '';
    const s = String(v);
    return /[",\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
  };
  const lines = [head.join(',')];
  for (const r of rows) {
    const cells = [String(r.pos).replace(/(\d+)$/, m => String(Number(m))),
      r.product_id, r.short_name, r.plu, r.packs];
    if (hasRec) cells.push(r.r && r.r.opening_packs, r.r && r.r.add_in, r.r && r.r.sold_physical,
      r.r && r.r.sold_pos, r.r && r.r.variance_packs);
    lines.push(cells.map(q).join(','));
  }
  const blob = new Blob([lines.join('\n')], { type: 'text/csv;charset=utf-8' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = (c.title || 'cig-count').replace(/[^\w-]+/g, '_') + '.csv';
  document.body.appendChild(a);
  a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 0);
}

el('btnBack').addEventListener('click', renderList);

init().catch(e => { console.error(e); setStatus('Failed to load: ' + e.message, true); });
</script>

<script src="../sidebar.js"></script>
</body>
</html>
