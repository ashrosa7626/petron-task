<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Start a Stock Count – Petron Tasks</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;600&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root {
      --p-bg:#0B0F1A; --p-card:#121826; --p-border:#1F2A44; --p-header:#0F1B3D;
      --p-blue:#3B82F6; --p-blue-lt:#60A5FA; --p-green:#22C55E; --p-amber:#F59E0B;
      --p-red:#FF4D4F; --p-orange:#F97316;
      --p-text:#E6EDF7; --p-text2:#94A3B8; --p-text3:#64748B; --p-btn-sec:#1F2A44;
      --font:'IBM Plex Sans',sans-serif; --mono:'IBM Plex Mono',monospace;
      --radius:12px; --radius-sm:8px;
    }
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    body{background:var(--p-bg);color:var(--p-text);font-family:var(--font);min-height:100vh;font-size:17px}
    .topbar{background:var(--p-header);border-bottom:1px solid var(--p-border);padding:0 20px;height:56px;display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:100}
    .topbar-title{font-size:1.1rem;font-weight:800;font-family:'Syne',sans-serif;flex:1;text-align:center}
    .topbar-title .br{color:var(--p-blue-lt)}
    .topbar a{color:var(--p-text2);text-decoration:none;font-size:0.85rem}
    .topbar a:hover{color:var(--p-text)}
    .spacer{min-width:70px}

    .content{max-width:520px;margin:0 auto;padding:22px 16px 80px}
    .card{background:var(--p-card);border:1px solid var(--p-border);border-radius:var(--radius);padding:18px;margin-bottom:14px}
    .section-hd{font-size:1.3rem;font-weight:800;margin-bottom:4px}
    .section-sub{font-size:0.95rem;color:var(--p-text3);margin-bottom:18px}
    .fld{margin-bottom:16px}
    .lbl{display:block;font-size:0.8rem;font-weight:700;color:var(--p-amber);text-transform:uppercase;letter-spacing:0.7px;margin-bottom:6px}
    .hint{font-size:0.8rem;color:var(--p-text3);margin-top:6px;line-height:1.5}
    .inp{width:100%;background:var(--p-btn-sec);border:1px solid var(--p-border);border-radius:var(--radius-sm);color:var(--p-text);padding:12px 14px;font-size:1rem;font-family:var(--font);outline:none}
    .inp:focus{border-color:var(--p-blue)}
    .inp[type=date]{font-family:var(--mono)}
    .btn{width:100%;border:none;border-radius:var(--radius);padding:15px;font-family:var(--font);font-weight:800;font-size:1rem;cursor:pointer;background:linear-gradient(135deg,var(--p-orange),var(--p-amber));color:#0B0F1A}
    .btn:disabled{opacity:0.5;cursor:default}
    .btn.sec{background:var(--p-btn-sec);color:var(--p-text);margin-top:10px}

    .note{border-radius:var(--radius-sm);padding:12px 14px;font-size:0.87rem;line-height:1.55;margin-bottom:14px}
    .note.info{background:rgba(59,130,246,0.08);border:1px solid rgba(59,130,246,0.3);color:var(--p-blue-lt)}
    .note.warn{background:rgba(245,158,11,0.08);border:1px solid rgba(245,158,11,0.3);color:var(--p-amber)}
    .note.err{background:rgba(255,77,79,0.08);border:1px solid rgba(255,77,79,0.3);color:var(--p-red)}
    .note.ok{background:rgba(34,197,94,0.08);border:1px solid rgba(34,197,94,0.3);color:var(--p-green)}
    .note b{font-weight:700}
    /* Room for the menu button the sidebar puts at top-left. It is the only
       way out of a page now — the old back links went one place each, and from
       inside the cigarette module there was no route to the rest of the app. */
    .sb-gap{width:44px;flex-shrink:0}
    [hidden]{display:none !important}
  </style>
</head>
<body>

<div class="topbar">
  <div class="sb-gap"></div>
  <div class="topbar-title"><span class="br" id="brLabel">Safari</span> <span id="modLabel">Cigarette Count</span></div>
  <div class="spacer"><a href="history.html">Results</a></div>
</div>

<div class="content">
  <div class="section-hd">Start a count</div>
  <div class="section-sub">One count per shelf per trading day. Packs put onto the shelf
    between counts are recorded separately &mdash; see <b>Restock</b> below.</div>
  <div class="section-sub" id="modSub" hidden></div>

  <div id="notes"></div>

  <div class="card">
    <div class="fld">
      <label class="lbl" for="fTitle">Title</label>
      <input class="inp" id="fTitle" type="text" autocomplete="off" placeholder="Cig Count of DD/MM/YYYY">
      <div class="hint">A label only. The date below is the one the system trusts.</div>
    </div>

    <div class="fld">
      <label class="lbl" for="fDate">Trading day being closed</label>
      <input class="inp" id="fDate" type="date">
      <div class="hint" id="dateHint"></div>
    </div>

    <div class="fld">
      <label class="lbl" for="fStaff">Staff name</label>
      <input class="inp" id="fStaff" type="text" autocomplete="off" placeholder="Who is counting">
    </div>

    <button class="btn" id="btnGo" disabled>Loading…</button>
    <button class="btn sec" id="btnOpen" hidden>Open the planogram read-only</button>
    <button class="btn sec" id="btnRestock">Restock &mdash; add packs to the shelf</button>
    <button class="btn sec" id="btnHistory">View past counts</button>
    <button class="btn sec" id="btnImport">Import POS sales</button>
    <button class="btn sec" id="btnShelf">Edit the shelf &mdash; PLU, add, remove</button>
  </div>
</div>

<script type="module">
import { currentModule, href, categoryLabel, sessionKey, staffKey } from './modules.js';

const MOD = currentModule();
const SUPABASE_URL = 'https://vwffiuciogthfzekkkkz.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZ3ZmZpdWNpb2d0aGZ6ZWtra2t6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzU4NzcwMTAsImV4cCI6MjA5MTQ1MzAxMH0.OTEyOMn1fmUNV7pR51KMOLsMTNAfytt62uGS_AkQXyw';
/* Pinned to the anon key, deliberately.
   supabase-js otherwise picks up whatever session is sitting in
   localStorage under sb-<ref>-auth-token and sends THAT as the bearer
   token. Every RLS policy in this module is written `to anon`, so an
   authenticated request matches no policy at all and PostgREST returns
   an empty array with NO ERROR — the page then says "No active planogram
   version found" and there is nothing anywhere to explain why. Verified
   14 Sep 2026: same URL, anon bearer returns the row, session bearer
   returns []. It comes and goes as the token expires and refreshes,
   which is the worst possible way for this to behave.
   These pages have no sign-in by design, so there is no session to want. */
const db = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
  auth: { persistSession: false, autoRefreshToken: false, detectSessionInUrl: false }
});
const el = id => document.getElementById(id);

/* The trading day being closed — NOT the clock date.
   The count is taken at the POS rollover just after midnight, so a count
   made in the small hours of the 27th is closing the 26th. This is the same
   7am MYT rollover app.js uses, which lands on exactly that day. It is only
   a default: staff can correct it, and the field is what the system trusts. */
function tradingDay() {
  const myt = new Date(Date.now() + 8 * 60 * 60 * 1000);
  if (myt.getUTCHours() < 7) myt.setUTCDate(myt.getUTCDate() - 1);
  return myt.toISOString().slice(0, 10);
}
const ddmmyyyy = iso => {
  const [y, m, d] = iso.split('-');
  return `${d}/${m}/${y}`;
};
const defaultTitle = iso => MOD.countTitle(ddmmyyyy(iso));

function note(kind, html) {
  el('notes').insertAdjacentHTML('beforeend', `<div class="note ${kind}">${html}</div>`);
}
const clearNotes = () => { el('notes').innerHTML = ''; };

/* One entry per category in this module. Tobacco has two — the cigarette
   gondola and the Iluma cabinet are counted in one sitting — and each gets its
   own planogram version and its own stock_count row, because each reconciles
   against its own POS report. */
let ctx = { branchId: null, branchName: '', cats: [] };
let titleDirty = false;

el('fTitle').addEventListener('input', () => { titleDirty = true; });
el('fDate').addEventListener('input', () => {
  const iso = el('fDate').value;
  if (!iso) return;
  if (!titleDirty) el('fTitle').value = defaultTitle(iso);
  updateDateHint();
  checkExisting();
});

function updateDateHint() {
  const iso = el('fDate').value;
  if (!iso) { el('dateHint').textContent = ''; return; }
  const today = tradingDay();
  let msg = 'Closing figures for this day become the opening for the next.';
  if (iso === today) msg = 'Today&rsquo;s trading day. ' + msg;
  else if (iso < today) msg = '<b>Back-dated.</b> ' + msg;
  else msg = '<b>In the future.</b> Check this is the day you mean. ' + msg;
  el('dateHint').innerHTML = msg;
}

/* No branch may ever stand in for another.

   Every one of these pages used to fall back to whatever branch DID have a
   planogram when the selected one had none — with a warning, but still showing
   its grid, its counts and its history. Nilai Desa Jati has never had a
   planogram, so picking it showed Safari's data under a Nilai Desa Jati
   heading. A count taken from that screen would have been filed against the
   wrong branch, and no later reconciliation could tell.

   So the fallback is gone. If the selected branch has no active planogram, the
   page says so and stops. */
async function init() {
  let selected = 'Safari';
  try { selected = localStorage.getItem('selectedBranch') || 'Safari'; } catch (e) { /* storage may be unreachable */ }
  el('brLabel').textContent = selected;
  el('modLabel').textContent = MOD.short + ' Count';
  document.title = 'Start ' + MOD.short + ' Count – Petron Tasks';
  // Two shelves counted in one sitting deserves saying so up front.
  if (MOD.categories.length > 1) {
    el('modSub').innerHTML = `One sitting covers <b>` +
      MOD.categories.map(categoryLabel).join('</b> and <b>') + `</b>, counted together. ` +
      `A button on the count screen switches between them.`;
    el('modSub').hidden = false;
  }

  const iso = tradingDay();
  el('fDate').value = iso;
  el('fTitle').value = defaultTitle(iso);
  try { el('fStaff').value = localStorage.getItem(staffKey(MOD)) || ''; } catch (e) { /* leave it blank */ }
  updateDateHint();

  const [verRes, brRes] = await Promise.all([
    db.from('planogram_version').select('version_id,branch_id,category').eq('status', 'active'),
    db.from('branch').select('branch_id,name')
  ]);
  if (verRes.error) return fail('Could not read planogram_version: ' + escapeHtml(verRes.error.message));

  const versions = verRes.data || [];
  const branches = brRes.data || [];
  const norm = s => String(s || '').toLowerCase().replace(/[^a-z]/g, '');
  const match = branches.find(b => norm(b.branch_id) === norm(selected) || norm(b.name).includes(norm(selected)));
  if (!match) {
    return fail(`No branch called <b>${escapeHtml(selected)}</b> is configured. ` +
      `Switch branch in the menu.`);
  }
  ctx.branchId = match.branch_id;
  ctx.branchName = match.name;

  // A version per category. A module whose shelves are not all set up cannot be
  // counted as one sitting — the toggle would show an empty grid on one side
  // and there would be no record to submit it against.
  ctx.cats = MOD.categories.map(cat => ({
    category: cat,
    version: versions.find(v => v.branch_id === match.branch_id && v.category === cat) || null
  }));
  const missing = ctx.cats.filter(c => !c.version);
  if (missing.length) {
    return fail(`<b>${escapeHtml(ctx.branchName)}</b> has no ` +
      missing.map(m => `<b>${escapeHtml(categoryLabel(m.category).toLowerCase())}</b>`).join(' or ') +
      ` planogram yet, so there is nothing to count here. Counts, restocks and history all ` +
      `belong to a branch and a shelf, and will not be shown from another one. Switch branch ` +
      `in the menu, or set the shelf up on the Edit the Shelf page.`);
  }

  el('btnGo').disabled = false;
  el('btnGo').textContent = 'Start count';
  await checkExisting();
}

function fail(msg) {
  clearNotes();
  note('err', msg);
  el('btnGo').disabled = true;
  el('btnGo').textContent = 'Unavailable';
}

/* One count per branch per trading day. Show what already exists for the
   chosen date so a second tap resumes rather than surprises. */
/* What already exists for this day, per category.

   A module with two shelves can be half-done: someone submits the cigarettes
   and the tab dies before Iluma. So each category is checked separately and
   the page says which. Only when EVERY category is already submitted is there
   nothing left to do. */
async function checkExisting() {
  if (!ctx.branchId || !el('fDate').value) return;
  clearNotes();
  const date = el('fDate').value;

  const { data, error } = await db.from('stock_count')
    .select('count_id,category,status,staff_name,title,started_at,submitted_at')
    .eq('branch_id', ctx.branchId).eq('count_date', date);
  if (error) {
    note('warn', 'Could not check for an existing count: ' + escapeHtml(error.message));
    return;
  }
  const byCat = new Map((data || []).map(r => [r.category, r]));
  ctx.cats.forEach(c => { c.existing = byCat.get(c.category) || null; });

  const submitted = ctx.cats.filter(c => c.existing && c.existing.status === 'submitted');
  const drafts = ctx.cats.filter(c => c.existing && c.existing.status === 'draft');
  const fresh = ctx.cats.filter(c => !c.existing);
  const names = cs => cs.map(c => categoryLabel(c.category)).join(' and ');

  el('btnOpen').hidden = true;

  if (submitted.length === ctx.cats.length) {
    note('ok', `A count for <b>${ddmmyyyy(date)}</b> was already submitted by ` +
      `<b>${escapeHtml(submitted[0].existing.staff_name)}</b>. Submitted counts are frozen ` +
      `and cannot be reopened.`);
    el('btnGo').textContent = 'Already submitted';
    el('btnGo').disabled = true;
    el('btnOpen').hidden = false;
    return;
  }

  if (submitted.length) {
    // Half a sitting. Say exactly which half, because the other half is what
    // the button is about to open and the numbers are different shelves.
    note('warn', `<b>${escapeHtml(names(submitted))}</b> for ${ddmmyyyy(date)} ` +
      `${submitted.length === 1 ? 'has' : 'have'} already been submitted and cannot be ` +
      `reopened. Carrying on counts <b>${escapeHtml(names(ctx.cats.filter(c => !submitted.includes(c))))}</b> only.`);
  }
  if (drafts.length) {
    note('info', `A draft for <b>${ddmmyyyy(date)}</b> is already open ` +
      `(started by <b>${escapeHtml(drafts[0].existing.staff_name)}</b>). ` +
      `You will pick up where it left off.`);
  }

  el('btnGo').textContent = drafts.length && !fresh.length ? 'Resume draft' : 'Start count';
  el('btnGo').disabled = false;
}

const escapeHtml = s => String(s == null ? '' : s)
  .replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

const go = page => { location.href = href(page, MOD); };
el('btnOpen').addEventListener('click', () => {
  location.href = href('index.html', MOD) + (MOD.id === 'tobacco' ? '?' : '&') + 'readonly=1';
});
/* A restock is not a count and needs none of the state above — no title, no
   trading day chosen here, no draft. It is its own record, taken whenever packs
   go onto the shelf, and it reaches reconciliation as add_in. It lives on the
   hub rather than on the count grid for the same reason the results page does:
   nothing beside the count inputs may hint at a quantity. */
el('btnRestock').addEventListener('click', () => go('restock.html'));
el('btnHistory').addEventListener('click', () => go('history.html'));
el('btnImport').addEventListener('click', () => go('import-sales.html'));
/* The only page here that needs an account. Everything else about counting is
   deliberately sign-in free; the shelf decides what every count MEANS, so
   changing it is the one thing that is not. */
el('btnShelf').addEventListener('click', () => go('planogram.html'));

el('btnGo').addEventListener('click', async () => {
  const date = el('fDate').value;
  const staff = el('fStaff').value.trim();
  const title = el('fTitle').value.trim() || defaultTitle(date);
  if (!date) return note('err', 'Pick the trading day being closed.');
  if (!staff) { el('fStaff').focus(); return note('err', 'Enter the staff name.'); }

  el('btnGo').disabled = true;
  el('btnGo').textContent = 'Working…';
  // Remembering the name is a convenience. localStorage on the shop device fills
  // up — the briefing system keeps base64 photos in it — and setItem then raises
  // QuotaExceededError even for a short string. That must never stop a count.
  try { localStorage.setItem(staffKey(MOD), staff); } catch (e) { /* not worth blocking on */ }

  try {
    // One count per category, opened or resumed. A category already submitted
    // is skipped rather than reopened — submitted counts are frozen, and
    // trying would fail at the very end of a ten minute sitting.
    const open = [];
    for (const c of ctx.cats) {
      if (c.existing && c.existing.status === 'submitted') continue;
      const count = await openOrCreate(c, date, staff, title);
      open.push({
        category: c.category, count_id: count.count_id, version_id: c.version.version_id
      });
    }
    if (!open.length) throw new Error('Every shelf in this count is already submitted.');

    // NOT optional: the count screen reads this to know which counts are open,
    // so if it cannot be written the count genuinely cannot start. Say that
    // plainly rather than throwing a QuotaExceededError at the user.
    try {
      localStorage.setItem(sessionKey(MOD), JSON.stringify({
        module: MOD.id, counts: open,
        branch_id: ctx.branchId, branch_name: ctx.branchName,
        count_date: date, title, staff_name: staff
      }));
    } catch (e) {
      throw new Error('This device has no storage space left, so the count screen cannot be ' +
        'told which count to open. The count itself is saved — free some space and press ' +
        'Resume draft. (The shift briefings keep photos in the same storage.)');
    }
    location.href = href('index.html', MOD);
  } catch (e) {
    el('btnGo').disabled = false;
    el('btnGo').textContent = 'Start count';
    note('err', 'Could not start the count: ' + escapeHtml(e.message));
  }
});

/* Resume beats create. The database enforces one count per branch per day,
   so a duplicate tap is a normal outcome, not an error — if the insert trips
   the unique constraint we simply read back the row that won. */
async function openOrCreate(c, date, staff, title) {
  if (c.existing && c.existing.status === 'draft') return c.existing;

  const ins = await db.from('stock_count').insert({
    branch_id: ctx.branchId, category: c.category, version_id: c.version.version_id,
    count_date: date, title, staff_name: staff, status: 'draft'
  }).select().single();

  if (!ins.error) return ins.data;

  // 23505 = unique violation: someone else created it between our check and
  // insert. The constraint is (branch, category, date), so read back the row
  // that won for THIS category.
  const dup = ins.error.code === '23505' || /duplicate key|already exists/i.test(ins.error.message || '');
  if (!dup) throw new Error(ins.error.message);

  const { data, error } = await db.from('stock_count')
    .select('count_id,status,staff_name,title')
    .eq('branch_id', ctx.branchId).eq('category', c.category)
    .eq('count_date', date).limit(1);
  if (error) throw new Error(error.message);
  const row = (data || [])[0];
  if (!row) throw new Error('The count exists but could not be read back.');
  if (row.status === 'submitted') {
    throw new Error(`${categoryLabel(c.category)} has already been submitted for that day.`);
  }
  return row;
}

init().catch(e => { console.error(e); fail('Failed to load: ' + e.message); });
</script>

<script src="../sidebar.js"></script>
</body>
</html>
