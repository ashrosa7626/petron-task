<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Cigarette Count – Petron Tasks</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;600&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root {
      --p-bg:#0B0F1A; --p-card:#121826; --p-border:#1F2A44; --p-header:#0F1B3D;
      --p-blue:#3B82F6; --p-blue-lt:#60A5FA; --p-green:#22C55E; --p-amber:#F59E0B;
      --p-red:#FF4D4F; --p-orange:#F97316; --p-slate:#64748B;
      --p-text:#E6EDF7; --p-text2:#94A3B8; --p-text3:#64748B; --p-btn-sec:#1F2A44;
      --font:'IBM Plex Sans',sans-serif; --mono:'IBM Plex Mono',monospace;
      --radius:12px; --radius-sm:8px;
      /* Planogram geometry at zoom 1. Column width is fixed; blocks span facings. */
      --base-col:76px; --base-row:150px; --base-gutter:46px; --base-hdr:24px;
    }
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    html,body{height:100%}
    body{background:var(--p-bg);color:var(--p-text);font-family:var(--font);font-size:17px;
         display:flex;flex-direction:column;overflow:hidden}

    .topbar{background:var(--p-header);border-bottom:1px solid var(--p-border);padding:0 14px;height:56px;
            display:flex;align-items:center;gap:10px;flex-shrink:0;z-index:60}
    .topbar-title{font-size:1.05rem;font-weight:800;font-family:'Syne',sans-serif;flex:1;text-align:center;
                  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .topbar-title .br{color:var(--p-blue-lt)}
    .topbar a{color:var(--p-text2);text-decoration:none;font-size:0.85rem;white-space:nowrap}
    .topbar a:hover{color:var(--p-text)}

    .zoomctl{display:flex;gap:5px;align-items:center}
    .zbtn{background:var(--p-btn-sec);border:1px solid var(--p-border);color:var(--p-text);border-radius:8px;
          width:34px;height:34px;font-size:1rem;font-weight:700;cursor:pointer;font-family:var(--font);
          display:flex;align-items:center;justify-content:center;flex-shrink:0}
    .zbtn:hover{background:#2A3A5F}
    .zbtn.on{border-color:var(--p-orange);color:var(--p-orange);background:rgba(249,115,22,0.1)}
    .zbtn.wide{width:auto;padding:0 11px;font-size:0.78rem;font-weight:600}

    .metabar{display:flex;flex-wrap:wrap;gap:7px;padding:9px 14px;border-bottom:1px solid var(--p-border);
             background:var(--p-bg);flex-shrink:0;align-items:center}
    .chip{background:var(--p-card);border:1px solid var(--p-border);border-radius:99px;padding:4px 11px;
          font-size:0.76rem;color:var(--p-text2);white-space:nowrap}
    .chip b{color:var(--p-text);font-weight:700}
    .chip.warn{border-color:rgba(245,158,11,0.35);background:rgba(245,158,11,0.08);color:var(--p-amber)}
    .chip.go{border-color:rgba(249,115,22,0.5);background:rgba(249,115,22,0.12);color:var(--p-orange);
             cursor:pointer;font-weight:700}

    .status{margin:20px;padding:14px 16px;border-radius:var(--radius);background:var(--p-card);
            border:1px solid var(--p-border);color:var(--p-text2);font-size:0.9rem}
    .status.err{border-color:rgba(255,77,79,0.35);background:rgba(255,77,79,0.08);color:var(--p-red)}

    /* The pannable canvas. Scrolls in both directions; the header row and the
       shelf gutter stay pinned to their edges while it moves. */
    .scroller{flex:1;overflow:auto;position:relative;overscroll-behavior:contain;
              -webkit-overflow-scrolling:touch;touch-action:pan-x pan-y}
    .scroller.grabbing{cursor:grabbing}
    .grid{display:grid;gap:4px;width:max-content;padding:0 14px 14px 0;
          --z:1;
          --col-w:calc(var(--base-col) * var(--z));
          --row-h:calc(var(--base-row) * var(--z));
          --gutter-w:calc(var(--base-gutter) * var(--z));
          --hdr-h:calc(var(--base-hdr) * var(--z))}

    .colnum{position:sticky;top:0;z-index:4;background:var(--p-bg);height:var(--hdr-h);
            display:flex;align-items:center;justify-content:center;font-family:var(--mono);
            font-size:calc(11px * var(--z));color:var(--p-text3)}
    .shelf{position:sticky;left:0;z-index:5;background:var(--p-bg);width:var(--gutter-w);
           display:flex;align-items:center;justify-content:center;font-family:'Syne',sans-serif;
           font-weight:800;font-size:calc(16px * var(--z));color:var(--p-text3)}
    .corner{position:sticky;top:0;left:0;z-index:6;background:var(--p-bg)}

    /* One block per connected region of one product's facings. */
    .blk{position:relative;background:var(--p-card);border:1px solid var(--p-border);
         border-radius:var(--radius-sm);overflow:hidden;display:flex;flex-direction:column;
         align-items:center;justify-content:flex-start;text-align:center;min-width:0;
         padding:calc(9px * var(--z)) calc(5px * var(--z)) calc(5px * var(--z));
         gap:calc(3px * var(--z));transition:background 0.12s,border-color 0.12s}
    .blk-brand{position:absolute;top:0;left:0;right:0;height:3px}

    /* Colour carries state, not brand. */
    .blk.done{background:rgba(34,197,94,0.13);border-color:rgba(34,197,94,0.5)}
    .blk.nos{background:rgba(100,116,139,0.13);border-color:rgba(100,116,139,0.55);border-style:dashed}
    .blk.sib{box-shadow:inset 0 0 0 2px var(--p-amber)}
    .blk.here{border-color:var(--p-blue);box-shadow:0 0 0 2px rgba(59,130,246,0.45)}
    .blk.miss{border-color:var(--p-red);box-shadow:0 0 0 2px rgba(255,77,79,0.5)}

    /* Type size is identical in a 1-column and a 5-column block — wide blocks
       get more whitespace, not bigger text. */
    .blk-nm{font-size:calc(12px * var(--z));line-height:1.25;font-weight:600;color:var(--p-text);
            display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
            width:100%;word-break:break-word}
    .blk-plu{font-family:var(--mono);font-size:calc(9.5px * var(--z));color:var(--p-text3);
             width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    .blk-pos{font-family:var(--mono);font-size:calc(9px * var(--z));color:#2C3A57}
    .blk-of{position:absolute;top:calc(4px * var(--z));right:calc(4px * var(--z));font-family:var(--mono);
            font-size:calc(8.5px * var(--z));font-weight:600;color:var(--p-amber);
            background:rgba(245,158,11,0.15);border:1px solid rgba(245,158,11,0.35);
            border-radius:99px;padding:0 calc(4px * var(--z));z-index:2}
    .blk-hint{position:absolute;top:calc(4px * var(--z));left:calc(4px * var(--z));font-size:calc(10px * var(--z));
              font-weight:700;color:var(--p-amber);background:rgba(245,158,11,0.15);
              border:1px solid rgba(245,158,11,0.35);border-radius:99px;
              padding:0 calc(4px * var(--z));z-index:2;display:none}
    .blk.hashint .blk-hint{display:block}

    .pk{width:100%;background:var(--p-btn-sec);border:1px solid var(--p-border);border-radius:6px;
        color:var(--p-text);text-align:center;font-family:var(--mono);font-weight:600;
        font-size:calc(17px * var(--z));padding:calc(5px * var(--z)) 2px;outline:none;margin-top:auto;
        -moz-appearance:textfield}
    .pk::-webkit-outer-spin-button,.pk::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
    .pk:focus{border-color:var(--p-blue);background:#16213A}
    .blk.done .pk{border-color:rgba(34,197,94,0.45)}

    .sub{display:flex;gap:calc(3px * var(--z));width:100%}
    /* Add-in stays out of the way — most days it is untouched. */
    .ad{flex:1;min-width:0;background:transparent;border:1px dashed var(--p-border);border-radius:5px;
        color:var(--p-text3);text-align:center;font-family:var(--mono);font-size:calc(10px * var(--z));
        padding:calc(3px * var(--z)) 1px;outline:none;-moz-appearance:textfield}
    .ad::-webkit-outer-spin-button,.ad::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
    .ad:focus{border-style:solid;border-color:var(--p-blue);color:var(--p-text)}
    .ad.set{border-style:solid;border-color:var(--p-amber);color:var(--p-amber)}
    .nosb{flex:0 0 auto;background:transparent;border:1px solid var(--p-border);border-radius:5px;
          color:var(--p-text3);font-family:var(--font);font-size:calc(9.5px * var(--z));font-weight:700;
          padding:0 calc(5px * var(--z));cursor:pointer;white-space:nowrap}
    .blk.nos .nosb{border-color:var(--p-slate);color:var(--p-text2);background:rgba(100,116,139,0.2)}

    /* Overview: state colour only, no text. Tap a block to zoom to it. */
    .grid.ov .blk{cursor:pointer;padding:0;gap:0}
    .grid.ov .blk-nm,.grid.ov .blk-plu,.grid.ov .blk-pos,.grid.ov .pk,
    .grid.ov .sub,.grid.ov .blk-of,.grid.ov .blk-hint,.grid.ov .colnum,.grid.ov .shelf{display:none}
    .grid.ov{gap:2px}

    .footer{flex-shrink:0;border-top:1px solid var(--p-border);background:var(--p-header);
            padding:9px 14px;display:flex;align-items:center;gap:10px}
    .prog{flex:1;min-width:0}
    .prog-n{font-size:0.95rem;font-weight:800;font-family:'Syne',sans-serif}
    .prog-n b{color:var(--p-green)}
    .prog-bar{height:4px;background:var(--p-border);border-radius:99px;margin-top:5px;overflow:hidden}
    .prog-fill{height:100%;background:linear-gradient(90deg,var(--p-orange),var(--p-amber));width:0;
               transition:width 0.25s}
    .btn{border:none;border-radius:9px;padding:11px 15px;font-family:var(--font);font-weight:800;
         font-size:0.87rem;cursor:pointer;white-space:nowrap}
    .btn.sec{background:var(--p-btn-sec);color:var(--p-text)}
    .btn.pri{background:linear-gradient(135deg,var(--p-orange),var(--p-amber));color:#0B0F1A}
    .btn:disabled{opacity:0.45;cursor:default}

    .ovl{position:fixed;inset:0;background:rgba(5,8,15,0.75);z-index:200;display:flex;
         align-items:center;justify-content:center;padding:18px}
    .sheet{background:var(--p-card);border:1px solid var(--p-border);border-radius:var(--radius);
           max-width:460px;width:100%;max-height:80vh;display:flex;flex-direction:column}
    .sheet-hd{padding:16px 18px 10px;font-size:1.1rem;font-weight:800;font-family:'Syne',sans-serif}
    .sheet-sub{padding:0 18px 12px;font-size:0.86rem;color:var(--p-text3);line-height:1.5}
    .sheet-bd{overflow:auto;padding:0 18px}
    .sheet-ft{padding:14px 18px;display:flex;gap:9px;border-top:1px solid var(--p-border)}
    .missrow{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--p-border);
             cursor:pointer}
    .missrow:last-child{border-bottom:none}
    .missrow:hover .missnm{color:var(--p-orange)}
    .missnm{flex:1;font-size:0.9rem;font-weight:600}
    .misspos{font-family:var(--mono);font-size:0.76rem;color:var(--p-text3)}
    [hidden]{display:none !important}
  </style>
</head>
<body>

<div class="topbar">
  <a href="start.html">&larr; Count</a>
  <div class="topbar-title"><span class="br" id="brLabel">Safari</span> <span id="pgLabel">Planogram</span></div>
  <div class="zoomctl">
    <button class="zbtn" id="zOut" title="Zoom out">&minus;</button>
    <button class="zbtn" id="zIn" title="Zoom in">+</button>
    <button class="zbtn wide" id="zOv" title="Overview">Overview</button>
  </div>
</div>

<div class="metabar" id="meta"></div>
<div id="status" class="status">Loading planogram&hellip;</div>

<div class="scroller" id="scroller" hidden>
  <div class="grid" id="grid"></div>
</div>

<div class="footer" id="footer" hidden>
  <div class="prog">
    <div class="prog-n" id="progN">&mdash;</div>
    <div class="prog-bar"><div class="prog-fill" id="progFill"></div></div>
  </div>
  <button class="btn sec" id="btnNext">Next empty</button>
  <button class="btn pri" id="btnSubmit">Submit</button>
</div>

<div class="ovl" id="missOvl" hidden>
  <div class="sheet">
    <div class="sheet-hd" id="missHd">Not finished</div>
    <div class="sheet-sub">Every product needs a number or a &ldquo;not on shelf&rdquo; tick.
      A partial count produces variance nobody can explain, so submit stays closed until these are done.</div>
    <div class="sheet-bd" id="missBd"></div>
    <div class="sheet-ft">
      <button class="btn sec" id="missClose" style="flex:1">Close</button>
      <button class="btn pri" id="missJump" style="flex:1">Go to first</button>
    </div>
  </div>
</div>

<div class="ovl" id="doneOvl" hidden>
  <div class="sheet">
    <div class="sheet-hd" id="doneHd">Count submitted</div>
    <div class="sheet-sub" id="doneSub"></div>
    <div class="sheet-ft">
      <button class="btn pri" id="doneClose" style="flex:1">Done</button>
    </div>
  </div>
</div>

<script>
const SUPABASE_URL = 'https://vwffiuciogthfzekkkkz.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZ3ZmZpdWNpb2d0aGZ6ZWtra2t6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzU4NzcwMTAsImV4cCI6MjA5MTQ1MzAxMH0.OTEyOMn1fmUNV7pR51KMOLsMTNAfytt62uGS_AkQXyw';
const db = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
const el = id => document.getElementById(id);
const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c =>
  ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const setStatus = (msg, isErr) => {
  const s = el('status');
  s.hidden = false; s.textContent = msg;
  s.className = 'status' + (isErr ? ' err' : '');
};

/* ============================ session ============================ */
const params = new URLSearchParams(location.search);
let session = null;
try { session = JSON.parse(localStorage.getItem('cig_count') || 'null'); } catch (e) { session = null; }
let readonly = params.has('readonly') || !session;

const draftKey = () => 'cig_draft_' + (session && session.count_id);

/* lines: product_id -> { packs:number|null, add_in:number, nos:boolean } */
let lines = {};
function loadDraft() {
  if (!session) return;
  try {
    const raw = JSON.parse(localStorage.getItem(draftKey()) || 'null');
    if (raw && raw.lines) lines = raw.lines;
  } catch (e) { /* a corrupt draft must not block the count */ }
}
// Every keystroke is written locally. A count takes ten minutes inside a shop
// with thick walls; one dropped connection must not lose it.
function saveDraft() {
  if (!session) return;
  try {
    localStorage.setItem(draftKey(), JSON.stringify({ lines, updated: new Date().toISOString() }));
  } catch (e) { console.warn('local draft save failed', e); }
}
function lineOf(pid) {
  if (!lines[pid]) lines[pid] = { packs: null, add_in: 0, nos: false };
  return lines[pid];
}
const isDone = pid => {
  const l = lines[pid];
  return !!l && (l.nos || (l.packs !== null && l.packs !== undefined));
};

/* ======================= block derivation ======================= */
/* Facings are grouped by product_id — never by shelf position — then split
   into connected regions using 4-way adjacency. One product may own several
   regions; they share one identity and one input. */
function deriveBlocks(facings, shelves) {
  const rowOf = {};
  shelves.forEach((s, i) => { rowOf[s] = i; });

  const byProduct = new Map();
  for (const f of facings) {
    if (!byProduct.has(f.product_id)) byProduct.set(f.product_id, []);
    byProduct.get(f.product_id).push([rowOf[f.shelf], f.position]);
  }

  const blocks = [];
  const nonRect = [];

  for (const [productId, cells] of byProduct) {
    const key = (r, c) => r + ':' + c;
    const grid = new Set(cells.map(([r, c]) => key(r, c)));
    const seen = new Set();
    const regions = [];

    const sorted = [...cells].sort((a, b) => a[0] - b[0] || a[1] - b[1]);
    for (const start of sorted) {
      if (seen.has(key(start[0], start[1]))) continue;
      const queue = [start];
      const region = [];
      seen.add(key(start[0], start[1]));
      while (queue.length) {
        const [r, c] = queue.pop();
        region.push([r, c]);
        for (const [nr, nc] of [[r + 1, c], [r - 1, c], [r, c + 1], [r, c - 1]]) {
          if (grid.has(key(nr, nc)) && !seen.has(key(nr, nc))) {
            seen.add(key(nr, nc));
            queue.push([nr, nc]);
          }
        }
      }
      regions.push(region);
    }

    regions.forEach((region, i) => {
      const rows = region.map(c => c[0]);
      const cols = region.map(c => c[1]);
      const h = Math.max(...rows) - Math.min(...rows) + 1;
      const w = Math.max(...cols) - Math.min(...cols) + 1;
      // A region that is not a solid rectangle cannot be drawn as its bounding
      // box — the box would cover another product's facings. Fall back to one
      // rectangle per contiguous run within each row.
      if (h * w !== region.length) {
        nonRect.push({ productId, cells: region.length, box: h + 'x' + w });
        for (const rect of rowRuns(region)) {
          blocks.push(makeBlock(productId, rect, i, regions.length, shelves, true));
        }
      } else {
        blocks.push(makeBlock(productId, region, i, regions.length, shelves, false));
      }
    });
  }
  return { blocks, nonRect, productCount: byProduct.size };
}

function rowRuns(region) {
  const byRow = new Map();
  for (const [r, c] of region) {
    if (!byRow.has(r)) byRow.set(r, []);
    byRow.get(r).push(c);
  }
  const runs = [];
  for (const [r, cols] of byRow) {
    cols.sort((a, b) => a - b);
    let run = [[r, cols[0]]];
    for (let i = 1; i < cols.length; i++) {
      if (cols[i] === cols[i - 1] + 1) run.push([r, cols[i]]);
      else { runs.push(run); run = [[r, cols[i]]]; }
    }
    runs.push(run);
  }
  return runs;
}

function makeBlock(productId, region, regionIndex, regionTotal, shelves, fragment) {
  const rows = region.map(c => c[0]);
  const cols = region.map(c => c[1]);
  const minRow = Math.min(...rows), minCol = Math.min(...cols);
  return {
    productId, row: minRow, col: minCol,
    h: Math.max(...rows) - minRow + 1,
    w: Math.max(...cols) - minCol + 1,
    facings: region.length, regionIndex, regionTotal, fragment,
    label: [...new Set(rows)].sort((a, b) => a - b).map(r => {
      const rc = region.filter(c => c[0] === r).map(c => c[1]).sort((a, b) => a - b);
      return shelves[r] + (rc[0] === rc[rc.length - 1] ? rc[0] : rc[0] + '-' + rc[rc.length - 1]);
    }).join(', ')
  };
}

function brandColour(brand) {
  if (!brand) return 'var(--p-border)';
  let h = 0;
  for (let i = 0; i < brand.length; i++) h = (h * 31 + brand.charCodeAt(i)) % 360;
  return `hsl(${h} 62% 55%)`;
}

/* ============================ state ============================ */
let BLOCKS = [], PRODUCTS = new Map(), SHELVES = [], ORDER = [];
const scroller = () => el('scroller');
const gridEl = () => el('grid');

/* ============================ zoom ============================ */
const Z_MIN = 0.22, Z_MAX = 1.5, Z_OVERVIEW = 0.3, OV_THRESHOLD = 0.45;
let zoom = 1, lastFullZoom = 1;

function applyZoom(z, clientX, clientY) {
  z = Math.max(Z_MIN, Math.min(Z_MAX, z));
  const sc = scroller(), g = gridEl();
  const r = sc.getBoundingClientRect();
  // Anchor: keep the content point under the cursor/pinch centre still.
  const ax = clientX == null ? r.width / 2 : clientX - r.left;
  const ay = clientY == null ? r.height / 2 : clientY - r.top;
  const cx = (sc.scrollLeft + ax) / zoom;
  const cy = (sc.scrollTop + ay) / zoom;

  zoom = z;
  g.style.setProperty('--z', z);
  g.classList.toggle('ov', z < OV_THRESHOLD);
  el('zOv').classList.toggle('on', z < OV_THRESHOLD);
  void g.offsetWidth;                       // force reflow before scrolling

  sc.scrollLeft = cx * z - ax;
  sc.scrollTop = cy * z - ay;
  if (z >= OV_THRESHOLD) lastFullZoom = z;
}

el('zIn').addEventListener('click', () => applyZoom(zoom * 1.25));
el('zOut').addEventListener('click', () => applyZoom(zoom / 1.25));
el('zOv').addEventListener('click', () => {
  if (zoom < OV_THRESHOLD) applyZoom(lastFullZoom || 1);
  else applyZoom(Z_OVERVIEW);
});

// Trackpad pinch and ctrl+wheel arrive as a wheel event with ctrlKey set.
function onWheel(e) {
  if (!e.ctrlKey) return;
  e.preventDefault();
  applyZoom(zoom * (e.deltaY < 0 ? 1.08 : 1 / 1.08), e.clientX, e.clientY);
}

// Two-finger pinch.
let pinch = null;
const dist = t => Math.hypot(t[0].clientX - t[1].clientX, t[0].clientY - t[1].clientY);
function onTouchStart(e) {
  if (e.touches.length === 2) {
    pinch = { d: dist(e.touches), z: zoom };
    drag = null;
  }
}
function onTouchMove(e) {
  if (pinch && e.touches.length === 2) {
    e.preventDefault();
    const t = e.touches;
    applyZoom(pinch.z * (dist(t) / pinch.d),
      (t[0].clientX + t[1].clientX) / 2, (t[0].clientY + t[1].clientY) / 2);
  }
}
function onTouchEnd(e) { if (e.touches.length < 2) pinch = null; }

/* Drag to pan with a mouse. Native scrolling already handles touch. */
let drag = null;
function onPointerDown(e) {
  if (e.pointerType === 'touch' || e.button !== 0) return;
  if (e.target.closest('input,button')) return;
  drag = { x: e.clientX, y: e.clientY, sl: scroller().scrollLeft, st: scroller().scrollTop, moved: false };
  scroller().classList.add('grabbing');
}
function onPointerMove(e) {
  if (!drag) return;
  const dx = e.clientX - drag.x, dy = e.clientY - drag.y;
  if (Math.abs(dx) > 3 || Math.abs(dy) > 3) drag.moved = true;
  scroller().scrollLeft = drag.sl - dx;
  scroller().scrollTop = drag.st - dy;
}
function onPointerUp() {
  if (drag) scroller().classList.remove('grabbing');
  drag = null;
}

/* ===================== navigation helpers ===================== */
function blockEls(pid) {
  return [...gridEl().querySelectorAll('.blk[data-pid="' + CSS.escape(pid) + '"]')];
}
function centreOn(node, opts) {
  const sc = scroller();
  const nr = node.getBoundingClientRect(), sr = sc.getBoundingClientRect();
  sc.scrollTo({
    left: sc.scrollLeft + (nr.left - sr.left) - (sr.width - nr.width) / 2,
    top: sc.scrollTop + (nr.top - sr.top) - (sr.height - nr.height) / 2,
    behavior: (opts && opts.instant) ? 'auto' : 'smooth'
  });
}
function zoomToBlock(node) {
  const pid = node.dataset.pid;
  applyZoom(lastFullZoom < OV_THRESHOLD ? 1 : lastFullZoom);
  requestAnimationFrame(() => {
    const again = blockEls(pid)[Number(node.dataset.bi) || 0] || node;
    centreOn(again);
    const inp = again.querySelector('.pk');
    if (inp) setTimeout(() => inp.focus({ preventScroll: true }), 260);
    else highlight(pid, again);
  });
}

/* Focusing any piece highlights all its siblings; if a sibling is off screen,
   the focused piece shows an arrow pointing to it. Without this, someone
   counts C21, sees a number in the box and moves on, leaving two thirds of the
   LD Red stock uncounted — a variance that looks like theft. */
function clearHighlight() {
  gridEl().querySelectorAll('.blk.sib,.blk.here,.blk.hashint').forEach(b => {
    b.classList.remove('sib', 'here', 'hashint');
    const h = b.querySelector('.blk-hint');
    if (h) h.textContent = '';
  });
}
function highlight(pid, focusedEl) {
  clearHighlight();
  const els = blockEls(pid);
  if (els.length < 2) { if (focusedEl) focusedEl.classList.add('here'); return; }
  els.forEach(b => b.classList.add('sib'));
  if (focusedEl) focusedEl.classList.add('here');

  const sr = scroller().getBoundingClientRect();
  const dirs = new Set();
  for (const b of els) {
    if (b === focusedEl) continue;
    const r = b.getBoundingClientRect();
    const off = r.right < sr.left + 2 || r.left > sr.right - 2 ||
                r.bottom < sr.top + 2 || r.top > sr.bottom - 2;
    if (!off) continue;
    if (r.right < sr.left + 2) dirs.add('&larr;');
    else if (r.left > sr.right - 2) dirs.add('&rarr;');
    if (r.bottom < sr.top + 2) dirs.add('&uarr;');
    else if (r.top > sr.bottom - 2) dirs.add('&darr;');
  }
  if (dirs.size && focusedEl) {
    const h = focusedEl.querySelector('.blk-hint');
    if (h) { h.innerHTML = [...dirs].join(''); focusedEl.classList.add('hashint'); }
  }
}

function nextEmpty(fromPid) {
  const start = fromPid ? ORDER.indexOf(fromPid) + 1 : 0;
  for (let i = 0; i < ORDER.length; i++) {
    const pid = ORDER[(start + i) % ORDER.length];
    if (!isDone(pid)) return pid;
  }
  return null;
}
function goTo(pid) {
  if (!pid) return;
  if (zoom < OV_THRESHOLD) applyZoom(lastFullZoom || 1);
  const node = blockEls(pid)[0];
  if (!node) return;
  centreOn(node);
  const inp = node.querySelector('.pk');
  if (inp) setTimeout(() => inp.focus({ preventScroll: true }), 250);
  else highlight(pid, node);
}

/* ============================ render ============================ */
function render(facings, products, version, branches, fellBack) {
  SHELVES = [...new Set(facings.map(f => f.shelf))].sort();
  const maxPos = Math.max(...facings.map(f => f.position));
  PRODUCTS = products;

  const derived = deriveBlocks(facings, SHELVES);
  BLOCKS = derived.blocks.sort((a, b) => a.row - b.row || a.col - b.col);
  // Reading order across the gondola, one entry per product.
  ORDER = [...new Set(BLOCKS.map(b => b.productId))];

  const g = gridEl();
  g.style.gridTemplateColumns = `var(--gutter-w) repeat(${maxPos}, var(--col-w))`;
  g.style.gridTemplateRows = `var(--hdr-h) repeat(${SHELVES.length}, var(--row-h))`;

  let html = '<div class="corner"></div>';
  for (let p = 1; p <= maxPos; p++) {
    html += `<div class="colnum" style="grid-column:${p + 1};grid-row:1">${p}</div>`;
  }
  SHELVES.forEach((s, i) => {
    html += `<div class="shelf" style="grid-column:1;grid-row:${i + 2}">${esc(s)}</div>`;
  });

  const perProduct = {};
  const missingProd = [], overflowing = [];
  for (const b of BLOCKS) {
    perProduct[b.productId] = (perProduct[b.productId] || 0);
    const idx = perProduct[b.productId]++;
    const p = products.get(b.productId);
    if (!p) missingProd.push(b.productId);
    const name = p ? p.short_name : b.productId;
    const plu = p ? p.plu : '';
    if (name.length > 18) overflowing.push(name);

    const split = b.regionTotal > 1;
    html += `<div class="blk" data-pid="${esc(b.productId)}" data-bi="${idx}"
        title="${esc(name)} &middot; PLU ${esc(plu)} &middot; ${esc(b.label)}"
        style="grid-column:${b.col + 1} / span ${b.w};grid-row:${b.row + 2} / span ${b.h}">
        <div class="blk-brand" style="background:${brandColour(p && p.brand)}"></div>
        <div class="blk-hint"></div>
        ${split ? `<div class="blk-of">${b.regionIndex + 1} of ${b.regionTotal}</div>` : ''}
        <div class="blk-nm">${esc(name)}</div>
        <div class="blk-plu">${esc(plu)}</div>
        <div class="blk-pos">${esc(b.label)}</div>
        ${readonly ? '' : `
        <input class="pk" type="number" inputmode="numeric" min="0" step="1"
               data-pid="${esc(b.productId)}" aria-label="Packs for ${esc(name)}">
        <div class="sub">
          <input class="ad" type="number" inputmode="numeric" min="0" step="1" value="0"
                 data-pid="${esc(b.productId)}" title="Added to the shelf today"
                 aria-label="Add-in for ${esc(name)}">
          <button class="nosb" data-pid="${esc(b.productId)}" type="button"
                  title="Not on shelf">NOS</button>
        </div>`}
      </div>`;
  }
  g.innerHTML = html;

  el('status').hidden = true;
  scroller().hidden = false;
  if (!readonly) el('footer').hidden = false;

  wireGrid();
  syncAll();
  paintMeta(version, branches, fellBack, derived, facings, maxPos, missingProd);
  logBlocks(derived, facings, maxPos, missingProd, overflowing);
}

function paintMeta(version, branches, fellBack, derived, facings, maxPos, missingProd) {
  const branchName = (branches.find(b => b.branch_id === version.branch_id) || {}).name || version.branch_id;
  const splitCount = new Set(BLOCKS.filter(b => b.regionTotal > 1).map(b => b.productId)).size;
  const chips = [];
  if (session) {
    chips.push(`<div class="chip"><b>${esc(session.title)}</b></div>`);
    chips.push(`<div class="chip">closing <b>${esc(session.count_date)}</b></div>`);
    chips.push(`<div class="chip">${esc(session.staff_name)}</div>`);
    el('pgLabel').textContent = 'Cigarette Count';
  } else {
    chips.push(`<div class="chip go" id="chipStart">Start a count &rarr;</div>`);
    chips.push(`<div class="chip">read only</div>`);
    el('pgLabel').textContent = 'Cigarette Planogram';
  }
  chips.push(`<div class="chip"><b>${derived.productCount}</b> products</div>`);
  chips.push(`<div class="chip"><b>${facings.length}</b> facings</div>`);
  chips.push(`<div class="chip"><b>${BLOCKS.length}</b> blocks</div>`);
  if (splitCount) chips.push(`<div class="chip warn"><b>${splitCount}</b> split</div>`);
  if (missingProd.length) chips.push(`<div class="chip warn">${missingProd.length} with no product row</div>`);
  if (fellBack) chips.push(`<div class="chip warn">showing ${esc(branchName)}</div>`);
  el('meta').innerHTML = chips.join('');
  el('brLabel').textContent = session ? (session.branch_name || branchName) : branchName;
  const cs = el('chipStart');
  if (cs) cs.addEventListener('click', () => { location.href = 'start.html'; });
}

/* ========================= input wiring ========================= */
function wireGrid() {
  const g = gridEl();

  g.addEventListener('click', e => {
    const blk = e.target.closest('.blk');
    if (!blk) return;
    // In overview a tap means "take me there", not "edit".
    if (zoom < OV_THRESHOLD) { e.preventDefault(); zoomToBlock(blk); return; }
    if (e.target.closest('.nosb')) {
      const pid = e.target.closest('.nosb').dataset.pid;
      const l = lineOf(pid);
      l.nos = !l.nos;
      if (l.nos) l.packs = null;
      saveDraft(); syncProduct(pid); updateProgress();
      highlight(pid, blk);
      return;
    }
    if (!e.target.closest('input')) highlight(blk.dataset.pid, blk);
  });

  // One number per product, shared across every block that product owns.
  g.addEventListener('input', e => {
    const t = e.target;
    if (!t.dataset || !t.dataset.pid) return;
    const pid = t.dataset.pid, l = lineOf(pid);
    if (t.classList.contains('pk')) {
      const v = t.value.trim();
      l.packs = v === '' ? null : Math.max(0, Math.floor(Number(v) || 0));
      if (l.packs !== null) l.nos = false;
    } else if (t.classList.contains('ad')) {
      const v = t.value.trim();
      l.add_in = v === '' ? 0 : Math.max(0, Math.floor(Number(v) || 0));
    }
    saveDraft();
    syncProduct(pid, t);
    updateProgress();
  });

  g.addEventListener('focusin', e => {
    const blk = e.target.closest('.blk');
    if (blk) highlight(blk.dataset.pid, blk);
  });

  // The numeric keypad advances to the next empty block, so a whole count can
  // be done without tapping blocks directly.
  g.addEventListener('keydown', e => {
    if (e.key !== 'Enter') return;
    const t = e.target;
    if (!t.dataset || !t.dataset.pid) return;
    e.preventDefault();
    const nxt = nextEmpty(t.dataset.pid);
    if (nxt) goTo(nxt); else t.blur();
  });
}

/* Push state into every block of one product, and repaint its colour. */
function syncProduct(pid, exclude) {
  const l = lineOf(pid);
  for (const b of blockEls(pid)) {
    b.classList.toggle('done', l.packs !== null && l.packs !== undefined && !l.nos);
    b.classList.toggle('nos', !!l.nos);
    b.classList.remove('miss');
    const pk = b.querySelector('.pk');
    if (pk && pk !== exclude) pk.value = (l.packs === null || l.packs === undefined) ? '' : l.packs;
    if (pk) pk.disabled = !!l.nos;
    const ad = b.querySelector('.ad');
    if (ad) {
      if (ad !== exclude) ad.value = l.add_in || 0;
      ad.classList.toggle('set', (l.add_in || 0) > 0);
    }
    const nb = b.querySelector('.nosb');
    if (nb) nb.textContent = l.nos ? 'NOS' : 'NOS';
  }
}
function syncAll() {
  for (const pid of ORDER) syncProduct(pid);
  updateProgress();
}

/* Progress counts products, not blocks. LD Red is one of 54, not three. */
function updateProgress() {
  if (readonly) return;
  const total = ORDER.length;
  const done = ORDER.filter(isDone).length;
  el('progN').innerHTML = `<b>${done}</b> of ${total}`;
  el('progFill').style.width = (total ? (done / total * 100) : 0) + '%';
  el('btnSubmit').disabled = false;
}

el('btnNext').addEventListener('click', () => {
  const pid = nextEmpty(null);
  if (pid) goTo(pid);
  else el('progN').innerHTML = `<b>${ORDER.length}</b> of ${ORDER.length} &mdash; all counted`;
});

/* ============================ submit ============================ */
function missingProducts() {
  return ORDER.filter(pid => !isDone(pid));
}

el('btnSubmit').addEventListener('click', async () => {
  const missing = missingProducts();
  if (missing.length) return showMissing(missing);
  await doSubmit();
});

function showMissing(missing) {
  el('missHd').textContent = `${missing.length} product${missing.length === 1 ? '' : 's'} still to count`;
  el('missBd').innerHTML = missing.map(pid => {
    const p = PRODUCTS.get(pid) || {};
    const where = BLOCKS.filter(b => b.productId === pid).map(b => b.label).join(' | ');
    return `<div class="missrow" data-pid="${esc(pid)}">
        <div class="missnm">${esc(p.short_name || pid)}</div>
        <div class="misspos">${esc(where)}</div>
      </div>`;
  }).join('');
  el('missBd').querySelectorAll('.missrow').forEach(r => {
    r.addEventListener('click', () => { el('missOvl').hidden = true; goTo(r.dataset.pid); });
  });
  // Mark them on the grid too, so closing the sheet still shows what is left.
  gridEl().querySelectorAll('.blk.miss').forEach(b => b.classList.remove('miss'));
  missing.forEach(pid => blockEls(pid).forEach(b => b.classList.add('miss')));
  el('missOvl').hidden = false;
  el('missJump').onclick = () => { el('missOvl').hidden = true; goTo(missing[0]); };
}
el('missClose').addEventListener('click', () => { el('missOvl').hidden = true; });
el('doneClose').addEventListener('click', () => { location.href = 'start.html'; });

async function doSubmit() {
  const btn = el('btnSubmit');
  btn.disabled = true;
  btn.textContent = 'Submitting…';
  try {
    const rows = ORDER.map(pid => {
      const l = lineOf(pid);
      return {
        count_id: session.count_id,
        product_id: pid,
        packs: l.nos ? null : l.packs,
        add_in: l.add_in || 0,
        not_on_shelf: !!l.nos
      };
    });

    // Lines must land while the count is still a draft — the insert policy
    // checks the parent's status, and submitting freezes it.
    const up = await db.from('stock_count_line')
      .upsert(rows, { onConflict: 'count_id,product_id' });
    if (up.error) throw describe(up.error, 'writing the count lines');

    const fin = await db.from('stock_count')
      .update({ status: 'submitted', submitted_at: new Date().toISOString() })
      .eq('count_id', session.count_id).select();
    if (fin.error) throw describe(fin.error, 'marking the count submitted');
    if (!fin.data || !fin.data.length) {
      throw new Error('The count was not updated. It may already have been submitted.');
    }

    localStorage.removeItem(draftKey());
    localStorage.removeItem('cig_count');
    el('doneSub').innerHTML =
      `<b>${esc(session.title)}</b> is submitted and frozen. ` +
      `${rows.length} products recorded for the trading day ending ${esc(session.count_date)}.`;
    el('doneOvl').hidden = false;
    el('footer').hidden = true;
  } catch (e) {
    btn.disabled = false;
    btn.textContent = 'Submit';
    alert('Could not submit.\n\n' + e.message);
    console.error(e);
  }
}

function describe(error, what) {
  if (error.code === '42501') {
    return new Error(
      `Blocked by row level security while ${what}.\n\n` +
      `The stock_count update policy needs a WITH CHECK clause — without one ` +
      `Postgres reuses USING (status = 'draft'), so a row can never leave draft. ` +
      `Run 05_fix_submit_policy.sql in the Supabase SQL editor.`);
  }
  return new Error(error.message + (error.details ? ' — ' + error.details : ''));
}

/* ============================ logging ============================ */
function logBlocks(derived, facings, maxPos, missingProd, overflowing) {
  console.clear();
  console.log('%cCigarette planogram — derived blocks',
    'font-weight:700;font-size:13px;color:#60A5FA');
  console.log(`${SHELVES.join('')} × 1..${maxPos} · ${derived.productCount} products · ` +
    `${facings.length} facings · ${BLOCKS.length} blocks`);

  console.table(BLOCKS.map(b => {
    const p = PRODUCTS.get(b.productId) || {};
    return {
      product_id: b.productId, short_name: p.short_name || '(no product row)',
      plu: p.plu || '', brand: p.brand || '', at: b.label, facings: b.facings,
      w: b.w, h: b.h,
      block: b.regionTotal > 1 ? `${b.regionIndex + 1} of ${b.regionTotal}` : '1 of 1'
    };
  }));

  const drawn = BLOCKS.reduce((n, b) => n + b.facings, 0);
  console.log(drawn === facings.length
    ? `%c✓ ${drawn} facings drawn, matches the ${facings.length} rows read`
    : `%c✗ drew ${drawn} but read ${facings.length} — regions do not reconcile`,
    'color:' + (drawn === facings.length ? '#22C55E' : '#FF4D4F'));

  const split = [...new Set(BLOCKS.filter(b => b.regionTotal > 1).map(b => b.productId))];
  if (split.length) {
    console.groupCollapsed(`%c${split.length} product(s) split across blocks`, 'color:#F59E0B');
    for (const pid of split) {
      const parts = BLOCKS.filter(b => b.productId === pid);
      console.log(`${(PRODUCTS.get(pid) || {}).short_name || pid} — ${parts.length} blocks: ` +
        parts.map(b => b.label).join(' | '));
    }
    console.groupEnd();
  }
  if (derived.nonRect.length) console.warn('Non-rectangular regions, drawn as row runs:', derived.nonRect);
  if (missingProd.length) console.warn('Facings whose product_id has no product row:', missingProd);
  if (overflowing.length) console.warn(`short_name over 18 chars: ${overflowing.length}`, overflowing);

  window.blocks = BLOCKS;
  window.lines = lines;
  console.log('%cwindow.blocks / window.lines', 'color:#64748B');
}

/* ============================= load ============================= */
async function load() {
  loadDraft();

  const selected = (session && session.branch_name) ||
    localStorage.getItem('selectedBranch') || 'Safari';

  const [verRes, brRes] = await Promise.all([
    db.from('planogram_version').select('version_id,branch_id').eq('status', 'active'),
    db.from('branch').select('branch_id,name')
  ]);
  if (verRes.error) return setStatus('Could not read planogram_version: ' + verRes.error.message, true);

  const versions = verRes.data || [], branches = brRes.data || [];
  if (!versions.length) return setStatus('No active planogram version found.', true);

  let version = null, fellBack = false;
  if (session) version = versions.find(v => v.version_id === session.version_id) || null;
  if (!version) {
    const norm = s => String(s || '').toLowerCase().replace(/[^a-z]/g, '');
    const match = branches.find(b => norm(b.branch_id) === norm(selected) || norm(b.name).includes(norm(selected)));
    version = (match && versions.find(v => v.branch_id === match.branch_id)) || versions[0];
    fellBack = !match || version.branch_id !== (match && match.branch_id);
  }

  const [facRes, prodRes] = await Promise.all([
    db.from('planogram_facing').select('shelf,position,product_id').eq('version_id', version.version_id),
    db.from('product').select('product_id,short_name,plu,brand')
  ]);
  if (facRes.error) return setStatus('Could not read planogram_facing: ' + facRes.error.message, true);
  if (prodRes.error) return setStatus('Could not read product: ' + prodRes.error.message, true);

  const facings = facRes.data || [];
  if (!facings.length) return setStatus('Active version ' + version.version_id + ' has no facings.', true);

  // If this device has no local draft, fall back to whatever this count already
  // has in the database. Never read another day's count — the count is blind.
  if (session && !Object.keys(lines).length) {
    const { data } = await db.from('stock_count_line')
      .select('product_id,packs,add_in,not_on_shelf').eq('count_id', session.count_id);
    for (const r of (data || [])) {
      lines[r.product_id] = { packs: r.packs, add_in: r.add_in || 0, nos: !!r.not_on_shelf };
    }
    if (data && data.length) saveDraft();
  }

  render(facings, new Map((prodRes.data || []).map(p => [p.product_id, p])),
    version, branches, fellBack);

  const sc = scroller();
  sc.addEventListener('wheel', onWheel, { passive: false });
  sc.addEventListener('touchstart', onTouchStart, { passive: true });
  sc.addEventListener('touchmove', onTouchMove, { passive: false });
  sc.addEventListener('touchend', onTouchEnd, { passive: true });
  sc.addEventListener('pointerdown', onPointerDown);
  window.addEventListener('pointermove', onPointerMove);
  window.addEventListener('pointerup', onPointerUp);
  sc.addEventListener('scroll', () => {
    const here = gridEl().querySelector('.blk.here');
    if (here) highlight(here.dataset.pid, here);
  }, { passive: true });
}

load().catch(e => { console.error(e); setStatus('Failed to load: ' + e.message, true); });
</script>
