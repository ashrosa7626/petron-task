<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Cigarette Count – Petron Tasks</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;600&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link rel="stylesheet" href="planogram.css">
</head>
<body>

<div class="topbar">
  <div class="sb-gap"></div>
  <div class="topbar-title"><span class="br" id="brLabel">Safari</span> <span id="pgLabel">Planogram</span></div>
  <!-- One sitting, two shelves. Not navigation: nothing is saved or reloaded,
       both grids belong to the same count and Submit closes both. -->
  <div class="catsw" id="catSw" hidden></div>
  <div class="zoomctl">
    <button class="zbtn" id="zOut" title="Zoom out">&minus;</button>
    <button class="zbtn" id="zIn" title="Zoom in">+</button>
    <button class="zbtn wide" id="zOv" title="Overview">Overview</button>
  </div>
</div>

<div class="metabar" id="meta"></div>
<div id="status" class="status">Loading planogram&hellip;</div>

<!-- A scroller per category, built at load. Separate elements rather than one
     repainted element so each shelf keeps its own zoom and scroll position:
     flipping to Iluma and back should put you where you were, mid-count. -->
<div id="gridWrap" hidden></div>

<div class="footer" id="footer" hidden>
  <div class="prog">
    <div class="prog-n" id="progN">&mdash;</div>
    <div class="prog-bar"><div class="prog-fill" id="progFill"></div></div>
  </div>
  <button class="btn sec" id="btnNext">Next empty</button>
  <button class="btn pri" id="btnSubmit">Submit</button>
</div>

<div class="ovl" id="missOvl" hidden>
  <div class="sheet">
    <div class="sheet-hd" id="missHd">Not finished</div>
    <div class="sheet-sub">Every product needs a number &mdash; enter <b>0</b> if there is none on the shelf.
      A partial count produces variance nobody can explain, so submit stays closed until these are done.</div>
    <div class="sheet-bd" id="missBd"></div>
    <div class="sheet-ft">
      <button class="btn sec" id="missClose" style="flex:1">Close</button>
      <button class="btn pri" id="missJump" style="flex:1">Go to first</button>
    </div>
  </div>
</div>

<div class="ovl" id="doneOvl" hidden>
  <div class="sheet">
    <div class="sheet-hd" id="doneHd">Count submitted</div>
    <div class="sheet-sub" id="doneSub"></div>
    <div class="sheet-ft">
      <button class="btn pri" id="doneClose" style="flex:1">Done</button>
<script type="module">
import { createGrid, esc } from './planogram.js';
import { currentModule, href, categoryLabel, sessionKey, draftKey } from './modules.js';

const MOD = currentModule();
const SUPABASE_URL = 'https://vwffiuciogthfzekkkkz.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZ3ZmZpdWNpb2d0aGZ6ZWtra2t6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzU4NzcwMTAsImV4cCI6MjA5MTQ1MzAxMH0.OTEyOMn1fmUNV7pR51KMOLsMTNAfytt62uGS_AkQXyw';
const db = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
  auth: { persistSession: false, autoRefreshToken: false, detectSessionInUrl: false }
});
const el = id => document.getElementById(id);
const setStatus = (msg, isErr) => {
  const s = el('status');
  s.hidden = false; s.textContent = msg;
  s.className = 'status' + (isErr ? ' err' : '');
};

/* ============================ session ============================ */
const params = new URLSearchParams(location.search);
let session = null;
try { session = JSON.parse(localStorage.getItem(sessionKey(MOD)) || 'null'); } catch (e) { session = null; }

/* A session written before this page learned about categories holds a single
   count_id. Wrap it rather than discarding it: there may be a count open on
   the shop device right now, and its numbers live only in a local draft until
   Submit, so dropping the session would lose them outright. */
if (session && session.count_id && !session.counts) {
  session = {
    module: MOD.id,
    counts: [{ category: 'CIGARETTES', count_id: session.count_id, version_id: session.version_id }],
    branch_id: session.branch_id, branch_name: session.branch_name,
    count_date: session.count_date, title: session.title, staff_name: session.staff_name
  };
}
let readonly = params.has('readonly') || !session;

/* lines: product_id -> { packs:number|null }, flat across every category.
   product_id is unique system-wide, so one map cannot confuse two shelves —
   and the split-block rule (one input per product, however many blocks) falls
   out of it for free.

   One input per block, nothing else. A product with nothing on the shelf is
   counted as 0, so the schema's not_on_shelf flag is always written false.

   add_in is written 0 from here too — deliveries are NOT collected on the
   count screen. They arrive through restock.html, which writes its own records
   and reaches reconciliation through vw_daily_reconciliation. Nothing on this
   screen should ever try to capture stock going onto the shelf. */
let lines = {};

/* Drafts are per COUNT, not per session: each category has its own count_id in
   the database, so its numbers belong under its own key. A half-finished
   sitting therefore resumes correctly even if only one shelf was reached. */
function loadDraft() {
  if (!session) return;
  for (const c of session.counts) {
    try {
      const raw = JSON.parse(localStorage.getItem(draftKey(c.count_id)) || 'null');
      if (!raw || !raw.lines) continue;
      for (const [pid, l] of Object.entries(raw.lines)) {
        if (!l) continue;
        // Drafts written while the not-on-shelf tick existed stored packs = null
        // alongside nos = true. That always meant zero on the shelf, so read it
        // as 0 rather than losing the entry.
        if (l.nos && (l.packs === null || l.packs === undefined)) l.packs = 0;
        delete l.nos; delete l.add_in;
        lines[pid] = l;
      }
    } catch (e) { /* a corrupt draft must not block the count */ }
  }
}

// Every keystroke is written locally. A count takes ten minutes inside a shop
// with thick walls; one dropped connection must not lose it.
//
// Except when it cannot be written. localStorage on the shop device hit its
// 10MB cap once — briefing photos — and a draft is only a few KB, so it is not
// the count that is too big. This used to console.warn and carry on, which
// meant the safety net could be gone for a whole count with nothing on screen
// to say so: reload the tab, or let the phone sleep and Chrome evict it, and
// every number typed is lost. There is no server-side fallback mid-count
// either — lines are not written until Submit. So a failure is SAID OUT LOUD.
let draftBroken = false;
function saveDraft() {
  if (!session) return;
  let failed = false;
  for (const c of CATS) {
    const mine = {};
    for (const pid of c.order) if (lines[pid]) mine[pid] = lines[pid];
    try {
      localStorage.setItem(draftKey(c.count_id),
        JSON.stringify({ lines: mine, updated: new Date().toISOString() }));
    } catch (e) { failed = true; }
  }
  if (failed !== draftBroken) { draftBroken = failed; paintStorageChip(); }
}

/* Nothing on this screen can fix a full device, so the chip says what it means
   for the person counting: finish and submit without reloading. */
function paintStorageChip() {
  const bar = el('meta');
  if (!bar) return;
  const existing = el('chipStore');
  if (!draftBroken) { if (existing) existing.remove(); return; }
  if (existing) return;
  bar.insertAdjacentHTML('beforeend',
    '<div class="chip warn" id="chipStore" title="localStorage is full. A count draft is only ' +
    'a few KB, so it is the briefing photos using the space, not this count.">' +
    'not saving on this device &mdash; do not reload before submitting</div>');
}
function lineOf(pid) {
  if (!lines[pid]) lines[pid] = { packs: null };
  return lines[pid];
}
const isDone = pid => {
  const l = lines[pid];
  return !!l && l.packs !== null && l.packs !== undefined;
};

/* ============================ categories ============================ */
/* One entry per shelf in this sitting: its own planogram, its own grid element,
   its own zoom, and its own stock_count row. */
let CATS = [];
let active = 0;
const cur = () => CATS[active];
const allProducts = () => CATS.flatMap(c => c.order);

function renderCats() {
  const wrap = el('gridWrap');
  wrap.innerHTML = CATS.map((c, i) => `
    <div class="scroller" id="sc${i}" ${i === active ? '' : 'hidden'}>
      <div class="grid" id="gr${i}"></div>
    </div>`).join('');

  CATS.forEach((c, i) => {
    c.grid = createGrid({
      scroller: el('sc' + i),
      grid: el('gr' + i),
      // No zoom buttons passed: there is one set in the topbar for all shelves,
      // wired below to whichever is showing. Passing them per grid would have
      // every hidden grid react to a click too.
      cellHtml: (pid, name) => readonly ? '' :
        `<input class="pk" type="number" inputmode="numeric" min="0" step="1"
                data-pid="${esc(pid)}" aria-label="Packs for ${esc(name)}">`,
      onEnter: (pid, input) => {
        const nxt = nextEmpty(pid);
        if (nxt) goTo(nxt); else input.blur();
      }
    });
    c.derived = c.grid.render(c.facings, c.products);
    c.order = c.grid.order;

    el('gr' + i).addEventListener('input', e => {
      const t = e.target;
      if (!t.dataset || !t.dataset.pid || !t.classList.contains('pk')) return;
      const pid = t.dataset.pid, l = lineOf(pid);
      const v = t.value.trim();
      l.packs = v === '' ? null : Math.max(0, Math.floor(Number(v) || 0));
      saveDraft();
      syncProduct(pid, t);
      updateProgress();
    });
  });

  paintSwitcher();
}

/* One set of zoom controls, acting on the shelf in front of you. Overview
   toggles, so it needs the current zoom to decide which way. */
const Z_OVERVIEW = 0.3, OV_THRESHOLD = 0.45;
let lastFull = 1;
el('zIn').addEventListener('click', () => cur().grid.applyZoom(cur().grid.zoom * 1.25));
el('zOut').addEventListener('click', () => cur().grid.applyZoom(cur().grid.zoom / 1.25));
el('zOv').addEventListener('click', () => {
  const g = cur().grid;
  if (g.zoom < OV_THRESHOLD) g.applyZoom(lastFull || 1);
  else { lastFull = g.zoom; g.applyZoom(Z_OVERVIEW); }
  el('zOv').classList.toggle('on', cur().grid.zoom < OV_THRESHOLD);
});

/* The switcher carries each shelf's progress, so you can see Iluma still needs
   doing without flipping to it. */
function paintSwitcher() {
  const sw = el('catSw');
  if (CATS.length < 2) { sw.hidden = true; return; }
  sw.hidden = false;
  sw.innerHTML = CATS.map((c, i) => {
    const done = c.order.filter(isDone).length;
    return `<button data-i="${i}" class="${i === active ? 'on' : ''} ${done === c.order.length ? 'done' : ''}">` +
      `${esc(categoryLabel(c.category))}` +
      (readonly ? '' : `<span class="n">${done}/${c.order.length}</span>`) + `</button>`;
  }).join('');
  sw.querySelectorAll('button').forEach(b =>
    b.addEventListener('click', () => showCat(Number(b.dataset.i))));
}

function showCat(i) {
  if (i === active || !CATS[i]) return;
  CATS.forEach((c, n) => { el('sc' + n).hidden = n !== i; });
  active = i;
  el('zOv').classList.toggle('on', CATS[i].grid.zoom < OV_THRESHOLD);
  paintSwitcher();
  paintMeta();
}

/* ============================ navigation ============================ */
/* Walks the whole sitting, not just the shelf on screen: after the last
   uncounted cigarette it moves to Iluma and switches the grid to show it.
   Otherwise "Next empty" would go quiet with 21 products still blank. */
function nextEmpty(fromPid) {
  const all = allProducts();
  const start = fromPid ? all.indexOf(fromPid) + 1 : 0;
  for (let i = 0; i < all.length; i++) {
    const pid = all[(start + i) % all.length];
    if (!isDone(pid)) return pid;
  }
  return null;
}
const catOf = pid => CATS.findIndex(c => c.order.includes(pid));
function goTo(pid) {
  if (!pid) return;
  const i = catOf(pid);
  if (i < 0) return;
  if (i !== active) showCat(i);
  CATS[i].grid.goTo(pid);
}

/* ============================ chrome ============================ */
function paintMeta() {
  const c = cur();
  const chips = [];
  if (session) {
    chips.push(`<div class="chip"><b>${esc(session.title)}</b></div>`);
    chips.push(`<div class="chip">closing <b>${esc(session.count_date)}</b></div>`);
    chips.push(`<div class="chip">${esc(session.staff_name)}</div>`);
    el('pgLabel').textContent = MOD.short + ' Count';
  } else {
    chips.push(`<div class="chip go" id="chipStart">Start a count &rarr;</div>`);
    chips.push(`<div class="chip">read only</div>`);
    if (frozenNote) chips.push(`<div class="chip warn">${esc(frozenNote)}</div>`);
    el('pgLabel').textContent = MOD.short + ' Planogram';
  }
  const splitCount = new Set(c.grid.blocks.filter(b => b.regionTotal > 1).map(b => b.productId)).size;
  chips.push(`<div class="chip"><b>${c.derived.productCount}</b> products</div>`);
  chips.push(`<div class="chip"><b>${c.facings.length}</b> facings</div>`);
  chips.push(`<div class="chip"><b>${c.grid.blocks.length}</b> blocks</div>`);
  if (splitCount) chips.push(`<div class="chip warn"><b>${splitCount}</b> split</div>`);
  if (c.grid.missingProducts.length) {
    chips.push(`<div class="chip warn">${c.grid.missingProducts.length} with no product row</div>`);
  }
  el('meta').innerHTML = chips.join('');
  paintStorageChip();
  el('brLabel').textContent = (session && session.branch_name) || ctx.branchName || 'Safari';
  const cs = el('chipStart');
  if (cs) cs.addEventListener('click', () => { location.href = href('start.html', MOD); });
}

/* Push state into every block of one product, and repaint its colour. */
function syncProduct(pid, exclude) {
  const l = lineOf(pid);
  const i = catOf(pid);
  if (i < 0) return;
  for (const b of CATS[i].grid.blockEls(pid)) {
    b.classList.toggle('done', l.packs !== null && l.packs !== undefined);
    b.classList.remove('miss');
    const pk = b.querySelector('.pk');
    if (pk && pk !== exclude) pk.value = (l.packs === null || l.packs === undefined) ? '' : l.packs;
  }
}
function syncAll() {
  for (const pid of allProducts()) syncProduct(pid);
  updateProgress();
}

/* Progress counts products across the WHOLE sitting — 54 cigarettes plus 21
   Iluma — because Submit closes both. A footer that only counted the shelf on
   screen would read 54 of 54 with a cabinet still untouched. */
function updateProgress() {
  if (readonly) return;
  const all = allProducts();
  const done = all.filter(isDone).length;
  el('progN').innerHTML = `<b>${done}</b> of ${all.length}`;
  el('progFill').style.width = (all.length ? (done / all.length * 100) : 0) + '%';
  el('btnSubmit').disabled = false;
  paintSwitcher();
}

el('btnNext').addEventListener('click', () => {
  const pid = nextEmpty(null);
  if (pid) goTo(pid);
  else {
    const n = allProducts().length;
    el('progN').innerHTML = `<b>${n}</b> of ${n} &mdash; all counted`;
  }
});

/* ============================ submit ============================ */
const missingProducts = () => allProducts().filter(pid => !isDone(pid));

el('btnSubmit').addEventListener('click', async () => {
  const missing = missingProducts();
  if (missing.length) return showMissing(missing);
  await doSubmit();
});

function showMissing(missing) {
  el('missHd').textContent = `${missing.length} product${missing.length === 1 ? '' : 's'} still to count`;
  el('missBd').innerHTML = missing.map(pid => {
    const i = catOf(pid);
    const c = CATS[i] || {};
    const p = (c.products && c.products.get(pid)) || {};
    const where = (c.grid ? c.grid.blocks.filter(b => b.productId === pid) : [])
      .map(b => b.label).join(' | ');
    return `<div class="missrow" data-pid="${esc(pid)}">
        <div class="missnm">${esc(p.short_name || pid)}</div>
        <div class="misspos">${CATS.length > 1 ? esc(categoryLabel(c.category)) + ' &middot; ' : ''}${esc(where)}</div>
      </div>`;
  }).join('');
  el('missBd').querySelectorAll('.missrow').forEach(r => {
    r.addEventListener('click', () => { el('missOvl').hidden = true; goTo(r.dataset.pid); });
  });
  // Mark them on the grid too, so closing the sheet still shows what is left —
  // on every shelf, not just the one in front of you.
  CATS.forEach((c, i) =>
    el('gr' + i).querySelectorAll('.blk.miss').forEach(b => b.classList.remove('miss')));
  missing.forEach(pid => {
    const i = catOf(pid);
    if (i >= 0) CATS[i].grid.blockEls(pid).forEach(b => b.classList.add('miss'));
  });
  el('missOvl').hidden = false;
  el('missJump').onclick = () => { el('missOvl').hidden = true; goTo(missing[0]); };
}
el('missClose').addEventListener('click', () => { el('missOvl').hidden = true; });
el('doneClose').addEventListener('click', () => { location.href = href('start.html', MOD); });

async function doSubmit() {
  const btn = el('btnSubmit');
  btn.disabled = true;
  btn.textContent = 'Submitting…';
  try {
    // Lines first for every shelf, then flip each count. Lines must land while
    // the count is still a draft — the insert policy checks the parent's
    // status, and submitting freezes it.
    for (const c of CATS) {
      const rows = c.order.map(pid => ({
        count_id: c.count_id,
        product_id: pid,
        packs: lineOf(pid).packs,
        // The count screen collects one number per product. Deliveries are not
        // captured here — they come from restock.html, which reconciliation
        // adds on top — so add_in is always 0. Nothing on the shelf is counted
        // as 0, so not_on_shelf is never set and counted_or_absent is satisfied
        // by packs always being present.
        add_in: 0,
        not_on_shelf: false
      }));
      const up = await db.from('stock_count_line')
        .upsert(rows, { onConflict: 'count_id,product_id' });
      if (up.error) throw describe(up.error, `writing the ${categoryLabel(c.category)} lines`);
    }

    for (const c of CATS) {
      const fin = await db.from('stock_count')
        .update({ status: 'submitted', submitted_at: new Date().toISOString() })
        .eq('count_id', c.count_id).select();
      if (fin.error) throw describe(fin.error, `marking ${categoryLabel(c.category)} submitted`);
      if (!fin.data || !fin.data.length) {
        throw new Error(`${categoryLabel(c.category)} was not updated. It may already have been submitted.`);
      }
    }

    for (const c of CATS) localStorage.removeItem(draftKey(c.count_id));
    localStorage.removeItem(sessionKey(MOD));
    const n = allProducts().length;
    el('doneSub').innerHTML =
      `<b>${esc(session.title)}</b> is submitted and frozen. ` +
      `${n} products across ${CATS.length === 1 ? 'one shelf' : CATS.length + ' shelves'} ` +
      `recorded for the trading day ending ${esc(session.count_date)}.`;
    el('doneOvl').hidden = false;
    el('footer').hidden = true;
  } catch (e) {
    btn.disabled = false;
    btn.textContent = 'Submit';
    alert('Could not submit.\n\n' + e.message);
    console.error(e);
  }
}

function describe(error, what) {
  if (error.code === '42501') {
    return new Error(
      `Blocked by row level security while ${what}.\n\n` +
      `The stock_count update policy needs a WITH CHECK clause — without one ` +
      `Postgres reuses USING (status = 'draft'), so a row can never leave draft. ` +
      `Run 05_fix_submit_policy.sql in the Supabase SQL editor.`);
  }
  return new Error(error.message + (error.details ? ' — ' + error.details : ''));
}

/* ============================= load ============================= */
let frozenNote = '';
const ctx = { branchName: '' };

async function load() {
  // A stale session can point at counts that have since been submitted and
  // frozen. Writing to them would fail at the very end of a long sitting, so
  // check first and fall back to read-only.
  if (session) {
    const ids = session.counts.map(c => c.count_id);
    const { data, error } = await db.from('stock_count')
      .select('count_id,status').in('count_id', ids);
    if (!error) {
      const byId = new Map((data || []).map(r => [r.count_id, r]));
      const live = session.counts.filter(c => (byId.get(c.count_id) || {}).status === 'draft');
      if (!live.length) {
        frozenNote = (data || []).length
          ? 'That count is already submitted and frozen.'
          : 'That count no longer exists — showing the planogram read-only.';
        readonly = true;
        session.counts.forEach(c => localStorage.removeItem(draftKey(c.count_id)));
        localStorage.removeItem(sessionKey(MOD));
        session = null;
      } else if (live.length < session.counts.length) {
        // Half the sitting is already in. Carry on with the rest rather than
        // dropping the whole session, which would strand the unsubmitted half.
        frozenNote = 'Part of this count was already submitted.';
        session.counts = live;
      }
    }
  }

  loadDraft();

  let selected = 'Safari';
  try {
    selected = (session && session.branch_name) || localStorage.getItem('selectedBranch') || 'Safari';
  } catch (e) { /* storage may be unreachable */ }

  const [verRes, brRes] = await Promise.all([
    db.from('planogram_version').select('version_id,branch_id,category').eq('status', 'active'),
    db.from('branch').select('branch_id,name')
  ]);
  if (verRes.error) return setStatus('Could not read planogram_version: ' + verRes.error.message, true);

  const versions = verRes.data || [], branches = brRes.data || [];
  const norm = s => String(s || '').toLowerCase().replace(/[^a-z]/g, '');
  const match = branches.find(b => norm(b.branch_id) === norm(selected) || norm(b.name).includes(norm(selected)));
  ctx.branchName = (match && match.name) || selected;

  /* A session pins the versions it was started against. Without one, the branch
     decides — and only the branch that was actually asked for. There is no
     falling back to another branch's shelf: the count is blind, so somebody
     counting Safari's layout under a Nilai Desa Jati heading could not tell. */
  let wanted;
  if (session) {
    wanted = session.counts.map(c => ({
      category: c.category, count_id: c.count_id,
      version_id: c.version_id ||
        (versions.find(v => v.category === c.category && match && v.branch_id === match.branch_id) || {}).version_id
    }));
  } else {
    if (!match) return setStatus(`No branch called ${selected} is configured.`, true);
    wanted = MOD.categories.map(cat => {
      const v = versions.find(x => x.branch_id === match.branch_id && x.category === cat);
      return { category: cat, count_id: null, version_id: v && v.version_id };
    });
  }
  const noShelf = wanted.filter(w => !w.version_id);
  if (noShelf.length) {
    return setStatus(`${ctx.branchName} has no ` +
      noShelf.map(w => categoryLabel(w.category).toLowerCase()).join(' or ') +
      ` planogram, so there is no shelf to show. Switch branch in the menu.`, true);
  }

  const [facRes, prodRes] = await Promise.all([
    db.from('planogram_facing').select('shelf,position,product_id,version_id')
      .in('version_id', wanted.map(w => w.version_id)),
    db.from('product').select('product_id,short_name,plu,brand,category')
  ]);
  if (facRes.error) return setStatus('Could not read planogram_facing: ' + facRes.error.message, true);
  if (prodRes.error) return setStatus('Could not read product: ' + prodRes.error.message, true);

  const products = new Map((prodRes.data || []).map(p => [p.product_id, p]));
  CATS = wanted.map(w => ({
    category: w.category,
    count_id: w.count_id,
    version_id: w.version_id,
    facings: (facRes.data || []).filter(f => f.version_id === w.version_id),
    products
  }));
  const empty = CATS.filter(c => !c.facings.length);
  if (empty.length) {
    return setStatus(`The ${empty.map(c => categoryLabel(c.category).toLowerCase()).join(' and ')} ` +
      `planogram has no facings.`, true);
  }

  el('status').hidden = true;
  el('gridWrap').hidden = false;
  if (!readonly) el('footer').hidden = false;

  renderCats();

  // Where this device has no local draft, fall back to whatever each count
  // already has in the database. Never read another day's count — blind means
  // blind.
  if (session && !Object.keys(lines).length) {
    for (const c of CATS) {
      const { data } = await db.from('stock_count_line')
        .select('product_id,packs,not_on_shelf').eq('count_id', c.count_id);
      for (const r of (data || [])) {
        lines[r.product_id] = { packs: r.not_on_shelf && r.packs === null ? 0 : r.packs };
      }
    }
    if (Object.keys(lines).length) saveDraft();
  }

  syncAll();
  paintMeta();
  CATS.forEach(c => c.grid.log());
  window.lines = lines;
}

load().catch(e => { console.error(e); setStatus('Failed to load: ' + e.message, true); });
</script>

<script src="../sidebar.js"></script>
</body>
</html>
