<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Cigarette Count – Petron Tasks</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;600&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link rel="stylesheet" href="planogram.css">
</head>
<body>

<div class="topbar">
  <a href="start.html">&larr; Count</a>
  <div class="topbar-title"><span class="br" id="brLabel">Safari</span> <span id="pgLabel">Planogram</span></div>
  <div class="zoomctl">
    <button class="zbtn" id="zOut" title="Zoom out">&minus;</button>
    <button class="zbtn" id="zIn" title="Zoom in">+</button>
    <button class="zbtn wide" id="zOv" title="Overview">Overview</button>
  </div>
</div>

<div class="metabar" id="meta"></div>
<div id="status" class="status">Loading planogram&hellip;</div>

<div class="scroller" id="scroller" hidden>
  <div class="grid" id="grid"></div>
</div>

<div class="footer" id="footer" hidden>
  <div class="prog">
    <div class="prog-n" id="progN">&mdash;</div>
    <div class="prog-bar"><div class="prog-fill" id="progFill"></div></div>
  </div>
  <button class="btn sec" id="btnNext">Next empty</button>
  <button class="btn pri" id="btnSubmit">Submit</button>
</div>

<div class="ovl" id="missOvl" hidden>
  <div class="sheet">
    <div class="sheet-hd" id="missHd">Not finished</div>
    <div class="sheet-sub">Every product needs a number &mdash; enter <b>0</b> if there is none on the shelf.
      A partial count produces variance nobody can explain, so submit stays closed until these are done.</div>
    <div class="sheet-bd" id="missBd"></div>
    <div class="sheet-ft">
      <button class="btn sec" id="missClose" style="flex:1">Close</button>
      <button class="btn pri" id="missJump" style="flex:1">Go to first</button>
    </div>
  </div>
</div>

<div class="ovl" id="doneOvl" hidden>
  <div class="sheet">
    <div class="sheet-hd" id="doneHd">Count submitted</div>
    <div class="sheet-sub" id="doneSub"></div>
    <div class="sheet-ft">
      <button class="btn pri" id="doneClose" style="flex:1">Done</button>
    </div>
  </div>
</div>

<script type="module">
import { createGrid, esc } from './planogram.js';

const SUPABASE_URL = 'https://vwffiuciogthfzekkkkz.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZ3ZmZpdWNpb2d0aGZ6ZWtra2t6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzU4NzcwMTAsImV4cCI6MjA5MTQ1MzAxMH0.OTEyOMn1fmUNV7pR51KMOLsMTNAfytt62uGS_AkQXyw';
const db = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
const el = id => document.getElementById(id);
const setStatus = (msg, isErr) => {
  const s = el('status');
  s.hidden = false; s.textContent = msg;
  s.className = 'status' + (isErr ? ' err' : '');
};

/* ============================ session ============================ */
const params = new URLSearchParams(location.search);
let session = null;
try { session = JSON.parse(localStorage.getItem('cig_count') || 'null'); } catch (e) { session = null; }
let readonly = params.has('readonly') || !session;

const draftKey = () => 'cig_draft_' + (session && session.count_id);

/* lines: product_id -> { packs:number|null }
   One input per block, nothing else. A product with nothing on the shelf is
   counted as 0, so the schema's not_on_shelf flag is always written false.

   add_in is written 0 from here too — deliveries are NOT collected on the
   count screen. They arrive through restock.html, which writes its own records
   and reaches reconciliation through vw_daily_reconciliation. Nothing on this
   screen should ever try to capture stock going onto the shelf. */
let lines = {};
function loadDraft() {
  if (!session) return;
  try {
    const raw = JSON.parse(localStorage.getItem(draftKey()) || 'null');
    if (raw && raw.lines) {
      lines = raw.lines;
      // Drafts written while the not-on-shelf tick existed stored packs = null
      // alongside nos = true. That always meant zero on the shelf, so read it
      // as 0 rather than losing the entry.
      for (const l of Object.values(lines)) {
        if (l && l.nos && (l.packs === null || l.packs === undefined)) l.packs = 0;
        if (l) { delete l.nos; delete l.add_in; }
      }
    }
  } catch (e) { /* a corrupt draft must not block the count */ }
}
// Every keystroke is written locally. A count takes ten minutes inside a shop
// with thick walls; one dropped connection must not lose it.
function saveDraft() {
  if (!session) return;
  try {
    localStorage.setItem(draftKey(), JSON.stringify({ lines, updated: new Date().toISOString() }));
  } catch (e) { console.warn('local draft save failed', e); }
}
function lineOf(pid) {
  if (!lines[pid]) lines[pid] = { packs: null };
  return lines[pid];
}
const isDone = pid => {
  const l = lines[pid];
  return !!l && l.packs !== null && l.packs !== undefined;
};

/* ============================ the grid ============================ */
/* Layout, zoom, panning and split-block highlighting live in planogram.js and
   are shared with restock.html. Everything below is count-specific: what a
   number means, when a block is done, and what submitting does. */
let grid = null;

/* ============================ render ============================ */
function render(facings, products, version, branches, fellBack) {
  grid = createGrid({
    scroller: el('scroller'),
    grid: el('grid'),
    zoomIn: el('zIn'),
    zoomOut: el('zOut'),
    overview: el('zOv'),
    cellHtml: (pid, name) => readonly ? '' :
      `<input class="pk" type="number" inputmode="numeric" min="0" step="1"
              data-pid="${esc(pid)}" aria-label="Packs for ${esc(name)}">`,
    onEnter: (pid, input) => {
      const nxt = nextEmpty(pid);
      if (nxt) grid.goTo(nxt); else input.blur();
    }
  });

  const derived = grid.render(facings, products);

  el('status').hidden = true;
  el('scroller').hidden = false;
  if (!readonly) el('footer').hidden = false;

  wireInput();
  syncAll();
  paintMeta(version, branches, fellBack, derived, facings);
  grid.log();
  window.lines = lines;
}

function paintMeta(version, branches, fellBack, derived, facings) {
  const branchName = (branches.find(b => b.branch_id === version.branch_id) || {}).name || version.branch_id;
  const splitCount = new Set(grid.blocks.filter(b => b.regionTotal > 1).map(b => b.productId)).size;
  const chips = [];
  if (session) {
    chips.push(`<div class="chip"><b>${esc(session.title)}</b></div>`);
    chips.push(`<div class="chip">closing <b>${esc(session.count_date)}</b></div>`);
    chips.push(`<div class="chip">${esc(session.staff_name)}</div>`);
    el('pgLabel').textContent = 'Cigarette Count';
  } else {
    chips.push(`<div class="chip go" id="chipStart">Start a count &rarr;</div>`);
    chips.push(`<div class="chip">read only</div>`);
    if (frozenNote) chips.push(`<div class="chip warn">${esc(frozenNote)}</div>`);
    el('pgLabel').textContent = 'Cigarette Planogram';
  }
  chips.push(`<div class="chip"><b>${derived.productCount}</b> products</div>`);
  chips.push(`<div class="chip"><b>${facings.length}</b> facings</div>`);
  chips.push(`<div class="chip"><b>${grid.blocks.length}</b> blocks</div>`);
  if (splitCount) chips.push(`<div class="chip warn"><b>${splitCount}</b> split</div>`);
  if (grid.missingProducts.length) {
    chips.push(`<div class="chip warn">${grid.missingProducts.length} with no product row</div>`);
  }
  if (fellBack) chips.push(`<div class="chip warn">showing ${esc(branchName)}</div>`);
  el('meta').innerHTML = chips.join('');
  el('brLabel').textContent = session ? (session.branch_name || branchName) : branchName;
  const cs = el('chipStart');
  if (cs) cs.addEventListener('click', () => { location.href = 'start.html'; });
}

/* ========================= input wiring ========================= */
// One number per product, shared across every block that product owns.
function wireInput() {
  el('grid').addEventListener('input', e => {
    const t = e.target;
    if (!t.dataset || !t.dataset.pid) return;
    const pid = t.dataset.pid, l = lineOf(pid);
    if (t.classList.contains('pk')) {
      const v = t.value.trim();
      l.packs = v === '' ? null : Math.max(0, Math.floor(Number(v) || 0));
    }
    saveDraft();
    syncProduct(pid, t);
    updateProgress();
  });
}

/* Push state into every block of one product, and repaint its colour. */
function syncProduct(pid, exclude) {
  const l = lineOf(pid);
  for (const b of grid.blockEls(pid)) {
    b.classList.toggle('done', l.packs !== null && l.packs !== undefined);
    b.classList.remove('miss');
    const pk = b.querySelector('.pk');
    if (pk && pk !== exclude) pk.value = (l.packs === null || l.packs === undefined) ? '' : l.packs;
  }
}
function syncAll() {
  for (const pid of grid.order) syncProduct(pid);
  updateProgress();
}

/* Progress counts products, not blocks. LD Red is one of 54, not three. */
function updateProgress() {
  if (readonly) return;
  const total = grid.order.length;
  const done = grid.order.filter(isDone).length;
  el('progN').innerHTML = `<b>${done}</b> of ${total}`;
  el('progFill').style.width = (total ? (done / total * 100) : 0) + '%';
  el('btnSubmit').disabled = false;
}

const nextEmpty = fromPid => grid.next(fromPid, pid => !isDone(pid));

el('btnNext').addEventListener('click', () => {
  const pid = nextEmpty(null);
  if (pid) grid.goTo(pid);
  else el('progN').innerHTML = `<b>${grid.order.length}</b> of ${grid.order.length} &mdash; all counted`;
});

/* ============================ submit ============================ */
function missingProducts() {
  return grid.order.filter(pid => !isDone(pid));
}

el('btnSubmit').addEventListener('click', async () => {
  const missing = missingProducts();
  if (missing.length) return showMissing(missing);
  await doSubmit();
});

function showMissing(missing) {
  el('missHd').textContent = `${missing.length} product${missing.length === 1 ? '' : 's'} still to count`;
  el('missBd').innerHTML = missing.map(pid => {
    const p = grid.products.get(pid) || {};
    const where = grid.blocks.filter(b => b.productId === pid).map(b => b.label).join(' | ');
    return `<div class="missrow" data-pid="${esc(pid)}">
        <div class="missnm">${esc(p.short_name || pid)}</div>
        <div class="misspos">${esc(where)}</div>
      </div>`;
  }).join('');
  el('missBd').querySelectorAll('.missrow').forEach(r => {
    r.addEventListener('click', () => { el('missOvl').hidden = true; grid.goTo(r.dataset.pid); });
  });
  // Mark them on the grid too, so closing the sheet still shows what is left.
  el('grid').querySelectorAll('.blk.miss').forEach(b => b.classList.remove('miss'));
  missing.forEach(pid => grid.blockEls(pid).forEach(b => b.classList.add('miss')));
  el('missOvl').hidden = false;
  el('missJump').onclick = () => { el('missOvl').hidden = true; grid.goTo(missing[0]); };
}
el('missClose').addEventListener('click', () => { el('missOvl').hidden = true; });
el('doneClose').addEventListener('click', () => { location.href = 'start.html'; });

async function doSubmit() {
  const btn = el('btnSubmit');
  btn.disabled = true;
  btn.textContent = 'Submitting…';
  try {
    const rows = grid.order.map(pid => {
      const l = lineOf(pid);
      return {
        count_id: session.count_id,
        product_id: pid,
        packs: l.packs,
        // The count screen collects one number per product. Deliveries are not
        // captured here — they come from restock.html, which reconciliation
        // adds on top of this figure — so add_in is always 0. Nothing on the
        // shelf is counted as 0, so not_on_shelf is never set and
        // counted_or_absent is satisfied by packs always being present.
        add_in: 0,
        not_on_shelf: false
      };
    });

    // Lines must land while the count is still a draft — the insert policy
    // checks the parent's status, and submitting freezes it.
    const up = await db.from('stock_count_line')
      .upsert(rows, { onConflict: 'count_id,product_id' });
    if (up.error) throw describe(up.error, 'writing the count lines');

    const fin = await db.from('stock_count')
      .update({ status: 'submitted', submitted_at: new Date().toISOString() })
      .eq('count_id', session.count_id).select();
    if (fin.error) throw describe(fin.error, 'marking the count submitted');
    if (!fin.data || !fin.data.length) {
      throw new Error('The count was not updated. It may already have been submitted.');
    }

    localStorage.removeItem(draftKey());
    localStorage.removeItem('cig_count');
    el('doneSub').innerHTML =
      `<b>${esc(session.title)}</b> is submitted and frozen. ` +
      `${rows.length} products recorded for the trading day ending ${esc(session.count_date)}.`;
    el('doneOvl').hidden = false;
    el('footer').hidden = true;
  } catch (e) {
    btn.disabled = false;
    btn.textContent = 'Submit';
    alert('Could not submit.\n\n' + e.message);
    console.error(e);
  }
}

function describe(error, what) {
  if (error.code === '42501') {
    return new Error(
      `Blocked by row level security while ${what}.\n\n` +
      `The stock_count update policy needs a WITH CHECK clause — without one ` +
      `Postgres reuses USING (status = 'draft'), so a row can never leave draft. ` +
      `Run 05_fix_submit_policy.sql in the Supabase SQL editor.`);
  }
  return new Error(error.message + (error.details ? ' — ' + error.details : ''));
}

/* ============================= load ============================= */
let frozenNote = '';

async function load() {
  loadDraft();

  // A stale session can point at a count that has since been submitted and
  // frozen. Writing to it would fail at the very end of a ten minute count,
  // so check first and fall back to read-only.
  if (session) {
    const { data, error } = await db.from('stock_count')
      .select('count_id,status,title,count_date,staff_name')
      .eq('count_id', session.count_id).limit(1);
    const row = (data || [])[0];
    if (!error && !row) {
      frozenNote = 'That count no longer exists — showing the planogram read-only.';
      readonly = true; session = null;
    } else if (row && row.status !== 'draft') {
      frozenNote = 'That count is already submitted and frozen.';
      readonly = true;
      localStorage.removeItem(draftKey());
      localStorage.removeItem('cig_count');
      session = null;
    }
  }

  const selected = (session && session.branch_name) ||
    localStorage.getItem('selectedBranch') || 'Safari';

  const [verRes, brRes] = await Promise.all([
    db.from('planogram_version').select('version_id,branch_id').eq('status', 'active'),
    db.from('branch').select('branch_id,name')
  ]);
  if (verRes.error) return setStatus('Could not read planogram_version: ' + verRes.error.message, true);

  const versions = verRes.data || [], branches = brRes.data || [];
  if (!versions.length) return setStatus('No active planogram version found.', true);

  let version = null, fellBack = false;
  if (session) version = versions.find(v => v.version_id === session.version_id) || null;
  if (!version) {
    const norm = s => String(s || '').toLowerCase().replace(/[^a-z]/g, '');
    const match = branches.find(b => norm(b.branch_id) === norm(selected) || norm(b.name).includes(norm(selected)));
    version = (match && versions.find(v => v.branch_id === match.branch_id)) || versions[0];
    fellBack = !match || version.branch_id !== (match && match.branch_id);
  }

  const [facRes, prodRes] = await Promise.all([
    db.from('planogram_facing').select('shelf,position,product_id').eq('version_id', version.version_id),
    db.from('product').select('product_id,short_name,plu,brand')
  ]);
  if (facRes.error) return setStatus('Could not read planogram_facing: ' + facRes.error.message, true);
  if (prodRes.error) return setStatus('Could not read product: ' + prodRes.error.message, true);

  const facings = facRes.data || [];
  if (!facings.length) return setStatus('Active version ' + version.version_id + ' has no facings.', true);

  // If this device has no local draft, fall back to whatever this count already
  // has in the database. Never read another day's count — the count is blind.
  if (session && !Object.keys(lines).length) {
    const { data } = await db.from('stock_count_line')
      .select('product_id,packs,not_on_shelf').eq('count_id', session.count_id);
    for (const r of (data || [])) {
      // A line saved before the not-on-shelf tick was removed reads as 0 packs,
      // which is what it always meant.
      lines[r.product_id] = { packs: r.not_on_shelf && r.packs === null ? 0 : r.packs };
    }
    if (data && data.length) saveDraft();
  }

  render(facings, new Map((prodRes.data || []).map(p => [p.product_id, p])),
    version, branches, fellBack);
}

load().catch(e => { console.error(e); setStatus('Failed to load: ' + e.message, true); });
</script>
</body>
</html>
